<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>小立鼠移動範圍 - 幾何教學系統</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      background-color: #0b1329;
      color: #f1f5f9;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    .custom-card {
      background: #162039;
      border: 1px solid #233358;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.4);
    }
    input[type=range] {
      accent-color: #f59e0b;
    }
    .mouse-inline-icon {
      display: inline-block;
      width: 1.35em;
      height: 1.35em;
      vertical-align: -0.22em;
      object-fit: contain;
      margin: 0 2px;
    }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button {
      -webkit-appearance: none;
      margin: 0;
    }
    input[type=number] {
      -moz-appearance: textfield;
    }
  </style>
</head>
<body class="flex flex-col p-2 md:p-3 justify-between h-full">

  <!-- 頂部列：模式選擇與規格標記 -->
  <header class="w-full max-w-7xl mx-auto flex items-center justify-between mb-2 flex-shrink-0">
    <div class="flex items-center space-x-3">
      <a href="index.html" class="bg-[#1e2c4f] hover:bg-[#283b6a] text-blue-200 px-3 py-1.5 rounded-xl text-xs md:text-sm font-medium border border-blue-500/20 flex items-center transition shadow-sm decoration-0">
        <i class="fa-solid fa-house mr-1.5"></i> 回首頁
      </a>
      
      <div class="flex items-center space-x-2">
        <span class="text-xs md:text-sm font-bold text-slate-300">模式：</span>
        <select id="lessonModeSelect" onchange="switchLessonMode(this.value)" class="bg-[#1e293b] text-amber-300 font-bold border border-amber-400/40 rounded-xl px-2.5 py-1 text-xs md:text-sm focus:outline-none cursor-pointer shadow-sm">
          <option value="farm_inside" selected>長方形圍欄內（無障礙物）</option>
          <option value="barn_obstacle">司令台角落障礙物（有障礙物）</option>
        </select>
      </div>
    </div>

    <!-- 步驟引導標籤（題型二司令台專用） -->
    <div id="stepIndicatorGroup" class="hidden items-center space-x-1 md:space-x-2 bg-slate-900/90 border border-slate-700/80 px-2.5 py-1 rounded-xl text-xs">
      <span id="step1Badge" class="px-2 py-0.5 rounded-md font-bold bg-amber-500 text-slate-950 transition">1. 拉直牽繩</span>
      <i class="fa-solid fa-angle-right text-slate-500 text-[10px]"></i>
      <span id="step2Badge" class="px-2 py-0.5 rounded-md text-slate-400 transition">2. 繞圈活動</span>
      <i class="fa-solid fa-angle-right text-slate-500 text-[10px]"></i>
      <span id="step3Badge" class="px-2 py-0.5 rounded-md text-slate-400 transition">3. 色塊比對</span>
    </div>

    <!-- 尺寸標籤 -->
    <div id="sizeBadge" class="bg-blue-950/70 border border-blue-500/30 px-3 py-1 rounded-xl text-xs text-blue-200 shadow-sm flex items-center">
      <span class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-2"></span>
      草地：長 <b class="text-amber-400 mx-0.5">16m</b> × 寬 <b class="text-amber-400 mx-0.5">10m</b>
    </div>
  </header>

  <!-- 主操作舞台 -->
  <main class="w-full max-w-7xl mx-auto flex-1 flex flex-col custom-card rounded-2xl p-3 md:p-4 relative overflow-hidden shadow-2xl min-h-0">
    
    <!-- 控制功能橫列 -->
    <div class="flex flex-wrap items-center justify-between gap-2 pb-2 border-b border-slate-700/60 flex-shrink-0">
      
      <!-- 題型一專屬控制：多隻小立鼠管理 + 木樁位置 -->
      <div id="ctrls_mode1" class="flex flex-wrap items-center gap-2">
        <div class="flex items-center space-x-1 bg-slate-900/90 p-1 rounded-xl border border-slate-700/80">
          <div id="mouseTabsContainer" class="flex items-center space-x-1"></div>
          <button id="addMouseBtn" onclick="addFarmMouse()" class="px-2 py-1 text-xs font-bold rounded-lg bg-emerald-600/80 hover:bg-emerald-500 text-white transition flex items-center shadow-sm" title="新增小立鼠進行比較">
            <i class="fa-solid fa-plus mr-1"></i> 新增
          </button>
        </div>

        <div class="flex items-center space-x-1">
          <span class="text-xs text-slate-300 font-medium hidden sm:inline">位置：</span>
          <div class="inline-flex rounded-xl p-1 bg-slate-900/80 border border-slate-700/80">
            <button id="btn_center" onclick="setSlotPreset('center')" class="pos-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition">正中央</button>
            <button id="btn_edge" onclick="setSlotPreset('bottom_edge')" class="pos-btn px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition">邊界</button>
            <button id="btn_corner" onclick="setSlotPreset('bottom_left')" class="pos-btn px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition">角落</button>
          </div>
        </div>
      </div>

      <!-- 題型二專屬控制：基礎 / 進階 -->
      <div id="ctrls_mode2" class="hidden items-center space-x-1.5">
        <span class="text-xs text-slate-300 font-medium">難度：</span>
        <div class="inline-flex rounded-xl p-1 bg-slate-900/80 border border-slate-700/80 space-x-1">
          <button id="btn_barn_basic" onclick="setBarnDifficulty('basic')" class="barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg bg-amber-600 text-white shadow-sm transition">
            基礎
          </button>
          <button id="btn_barn_adv" onclick="setBarnDifficulty('advanced')" class="barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg text-slate-300 hover:text-white transition">
            進階
          </button>
        </div>
      </div>

      <!-- 繩長顯示/滑桿 -->
      <div class="flex items-center space-x-2 bg-slate-900/80 px-2.5 py-1 rounded-xl border border-slate-700/80 shadow-sm">
        <span class="text-xs text-amber-300 font-bold flex items-center">
          <i class="fa-solid fa-ruler-horizontal mr-1 text-amber-400"></i> 繩長：
        </span>
        <input type="range" id="ropeSlider" min="1" max="4" step="1" value="2" class="w-20 md:w-28 cursor-pointer" oninput="handleRopeChange(this.value)">
        <span id="ropeValueText" class="text-xs font-mono font-bold text-amber-300 bg-amber-500/10 px-2 py-0.5 rounded border border-amber-500/30">
          2 m
        </span>
      </div>

      <!-- 操作按鈕群 -->
      <div class="flex items-center space-x-1.5">
        <button onclick="autoWalkCircle()" class="px-2.5 py-1 text-xs rounded-xl bg-indigo-600/70 hover:bg-indigo-600 text-white font-medium transition flex items-center shadow-sm">
          <i class="fa-solid fa-play mr-1"></i> <span id="autoWalkBtnText">全部走一圈</span>
        </button>
        <button onclick="resetExtractedSlices()" id="resetSliceBtn" class="px-2.5 py-1 text-xs rounded-xl bg-emerald-800/40 text-emerald-300 border border-emerald-500/30 transition flex items-center shadow-sm opacity-50 pointer-events-none">
          <i class="fa-solid fa-magnet mr-1"></i> 色塊歸位
        </button>
        <button onclick="resetCanvas()" class="px-2.5 py-1 text-xs rounded-xl bg-rose-900/40 hover:bg-rose-800 text-rose-200 transition flex items-center shadow-sm">
          <i class="fa-solid fa-rotate-right mr-1"></i> 清空
        </button>
      </div>
    </div>

    <!-- 主畫布 -->
    <div class="flex-1 w-full my-2 relative flex items-center justify-center bg-[#528d44] rounded-xl border border-emerald-900/60 overflow-hidden shadow-inner" id="canvasContainer">
      <canvas id="mainCanvas" class="block cursor-grab active:cursor-grabbing"></canvas>
      
      <!-- 浮動提示條 -->
      <div id="hintBadge" class="absolute top-2.5 left-2.5 bg-slate-900/85 border border-slate-700/80 text-[11px] text-slate-200 px-3 py-1.5 rounded-lg pointer-events-none backdrop-blur-sm flex items-center shadow max-w-[85%]">
        <i class="fa-solid fa-hand-pointer text-amber-400 mr-2 flex-shrink-0"></i>
        <span id="canvasHintText" class="truncate flex items-center">
          可點上方「+新增」比較多隻小立鼠<img src="Image.png" class="mouse-inline-icon">；繞完後將色塊拖至右側比對大小！
        </span>
      </div>
    </div>

    <!-- 底部區塊 A：題型一專屬（三隻小立鼠各自計算 + 學生下拉選單比較大小） -->
    <div id="bottomCalc_mode1" class="pt-2.5 border-t border-slate-700/60 flex flex-col gap-2.5 flex-shrink-0 text-xs md:text-sm">
      <!-- 第一排：各隻小立鼠計算卡 -->
      <div id="miceCalcList" class="flex flex-wrap items-center gap-2.5"></div>

      <!-- 第二排：學生下拉式選單比較大小（當有 2 隻以上小立鼠時顯示） -->
      <div id="miceCompareBar" class="hidden flex-wrap items-center justify-between gap-2 bg-slate-900/85 border border-slate-700/80 px-3 py-2 rounded-xl">
        <div class="flex flex-wrap items-center gap-2">
          <span class="font-bold text-amber-300 flex items-center">
            <i class="fa-solid fa-scale-balanced mr-1.5"></i> 活動面積大小比較（由大到小）：
          </span>
          <div id="compareDropdownsContainer" class="flex flex-wrap items-center gap-1.5"></div>
        </div>
        <button onclick="verifyMouseOrder()" class="bg-amber-600 hover:bg-amber-500 text-white font-bold px-3.5 py-1 rounded-lg text-xs md:text-sm tracking-wider shadow-md transition flex items-center">
          核對大小 <i class="fa-solid fa-check ml-1.5"></i>
        </button>
      </div>
    </div>

    <!-- 底部區塊 B：題型二專屬（司令台單一算式核對） -->
    <div id="bottomCalc_mode2" class="hidden pt-2.5 border-t border-slate-700/60 flex-wrap items-center justify-between gap-2 flex-shrink-0 text-xs md:text-sm">
      <div class="flex items-center space-x-2 text-slate-400">
        <span class="bg-slate-800/90 border border-slate-700 px-2.5 py-1 rounded-lg">
          題型：<b id="statusLessonText2" class="text-amber-300 font-semibold">司令台角落 (基礎)</b>
        </span>
        <span class="bg-slate-800/90 border border-slate-700 px-2.5 py-1 rounded-lg">
          目前繩長：<b id="statusRopeText2" class="text-amber-300 font-mono">0 m</b>
        </span>
      </div>

      <div class="flex items-center space-x-2">
        <span class="font-medium text-slate-200">計算活動面積：</span>
        <div class="relative flex items-center">
          <input type="number" id="userAnswerBarn" step="0.01" placeholder="填寫答案" class="bg-slate-900 border border-slate-600 rounded-lg px-2.5 py-1 text-sm text-amber-300 font-mono w-28 md:w-32 focus:outline-none focus:border-amber-400">
          <span class="ml-1.5 text-xs text-slate-400 font-mono font-medium">m²</span>
        </div>
        <button onclick="verifyBarnAnswer()" class="bg-emerald-600 hover:bg-emerald-500 text-white font-bold px-3 py-1 rounded-lg text-xs md:text-sm tracking-wider shadow-md transition flex items-center">
          核對答案 <i class="fa-solid fa-arrow-right ml-1"></i>
        </button>
      </div>
    </div>

  </main>

  <!-- 自訂提示視窗 -->
  <div id="modalBackdrop" class="fixed inset-0 bg-black/75 hidden backdrop-blur-sm flex items-center justify-center p-4 z-50">
    <div class="bg-[#162039] border border-blue-500/40 rounded-2xl max-w-lg w-full p-5 shadow-2xl text-center transform transition-all scale-95" id="modalBox">
      <div id="modalIcon" class="w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl mb-3"></div>
      <h3 id="modalTitle" class="text-lg font-bold mb-2 text-white"></h3>
      <div id="modalBody" class="text-xs md:text-sm text-slate-300 mb-5 leading-relaxed text-left bg-slate-900/70 p-3.5 rounded-xl border border-slate-800"></div>
      <button onclick="closeModal()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-semibold py-2 rounded-xl transition text-sm">
        確定
      </button>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('mainCanvas');
    const ctx = canvas.getContext('2d');
    const container = document.getElementById('canvasContainer');

    const MOUSE_ICON_HTML = '<img src="Image.png" class="mouse-inline-icon">';

    let currentMode = 'farm_inside';
    let meterScale = 1;
    let ropeRadiusM = 2; // 司令台模式專用

    // 互動狀態
    let isDraggingCow = false;
    let isDraggingPeg = false;
    let isStretchingRope = false;
    let barnExploreStage = 'stretch';
    let barnCornerBlocked = false;

    let activeDragSlice = null;
    let dragSliceOffset = { x: 0, y: 0 };

    let grassTufts = [];

    // 載入小立鼠圖片
    const squirrelImg = new Image();
    squirrelImg.src = 'Image.png';
    let isSquirrelLoaded = false;
    squirrelImg.onload = () => {
      isSquirrelLoaded = true;
      render();
    };

    // --- 題型一：長方形圍欄（支援多隻小立鼠） ---
    const FARM1_W_M = 16;
    const FARM1_H_M = 10;
    let farmRect = { x: 0, y: 0, w: 0, h: 0 };
    let slots = {};

    const MOUSE_PALETTES = [
      {
        label: '1號鼠',
        dotColor: '#10b981',
        sweepFill: 'rgba(16, 185, 129, 0.50)',
        sliceFill: 'rgba(52, 211, 153, 0.78)',
        stroke: '#10b981',
        badgeBg: '#065f46',
        borderCls: 'border-emerald-500/40'
      },
      {
        label: '2號鼠',
        dotColor: '#f59e0b',
        sweepFill: 'rgba(245, 158, 11, 0.50)',
        sliceFill: 'rgba(251, 191, 36, 0.78)',
        stroke: '#f59e0b',
        badgeBg: '#92400e',
        borderCls: 'border-amber-500/40'
      },
      {
        label: '3號鼠',
        dotColor: '#38bdf8',
        sweepFill: 'rgba(56, 189, 248, 0.50)',
        sliceFill: 'rgba(56, 189, 248, 0.78)',
        stroke: '#0284c7',
        badgeBg: '#075985',
        borderCls: 'border-sky-500/40'
      }
    ];

    let farmMice = [];
    let activeMouseId = null;
    let mouseCounter = 0;

    // 儲存學生在下拉選單的選擇狀態
    let studentComparePicks = ['', '', ''];
    let studentCompareOps = ['>', '>'];

    function getActiveMouse() {
      return farmMice.find(m => m.id === activeMouseId) || farmMice[0];
    }

    function initDefaultFarmMice() {
      farmMice = [];
      mouseCounter = 0;
      studentComparePicks = ['', '', ''];
      studentCompareOps = ['>', '>'];
      addFarmMouse('center', true);
    }

    function addFarmMouse(preferredSlot = null, isInit = false) {
      if (farmMice.length >= 3) {
        showModal('數量上限', '畫面上最多可同時放置 3 隻小立鼠進行比較喔！', 'info');
        return;
      }

      const usedPaletteIndices = farmMice.map(m => m.paletteIdx);
      let paletteIdx = 0;
      for (let i = 0; i < MOUSE_PALETTES.length; i++) {
        if (!usedPaletteIndices.includes(i)) {
          paletteIdx = i;
          break;
        }
      }

      let slotKey = preferredSlot;
      if (!slotKey) {
        const usedSlots = farmMice.map(m => m.slotKey);
        const candidates = ['center', 'bottom_edge', 'bottom_left', 'top_edge', 'top_right'];
        slotKey = candidates.find(k => !usedSlots.includes(k)) || 'center';
      }

      const slot = slots[slotKey] || { x: 0, y: 0, minAng: -Math.PI, maxAng: Math.PI };
      const activeM = getActiveMouse();
      const defaultR = activeM ? activeM.ropeRadiusM : 2;

      mouseCounter++;
      const newMouse = {
        id: 'mouse_' + mouseCounter,
        paletteIdx: paletteIdx,
        slotKey: slotKey,
        pegX: slot.x,
        pegY: slot.y,
        ropeRadiusM: defaultR,
        cowAngle: (slot.minAng + slot.maxAng) / 2,
        prevCowAngle: null,
        sweptIntervals: [],
        userInput: '',
        isSolved: false
      };

      farmMice.push(newMouse);
      activeMouseId = newMouse.id;

      if (!isInit) {
        updateFarmUI();
        resizeCanvas();
      }
    }

    function selectFarmMouse(id) {
      if (activeMouseId === id) return;
      activeMouseId = id;
      updateFarmUI();
      render();
    }

    function removeFarmMouse(id, event) {
      if (event) event.stopPropagation();
      if (farmMice.length <= 1) {
        showModal('無法刪除', '畫面上至少需要保留 1 隻小立鼠喔！', 'info');
        return;
      }

      const idx = farmMice.findIndex(m => m.id === id);
      if (idx === -1) return;

      farmMice.splice(idx, 1);
      draggableSlices = draggableSlices.filter(s => s.ownerMouseId !== id);
      updateResetSliceBtnState();

      studentComparePicks = studentComparePicks.map(p => (p === id ? '' : p));

      if (activeMouseId === id) {
        activeMouseId = farmMice[Math.max(0, idx - 1)].id;
      }

      updateFarmUI();
      resizeCanvas();
    }

    function handleMouseInputChange(id, val) {
      const m = farmMice.find(item => item.id === id);
      if (m) {
        m.userInput = val;
        m.isSolved = false;
      }
    }

    function verifySingleMouseAnswer(id) {
      const m = farmMice.find(item => item.id === id);
      if (!m) return;
      const val = parseFloat(m.userInput);
      const pal = MOUSE_PALETTES[m.paletteIdx];
      const slot = slots[m.slotKey];
      const r = m.ropeRadiusM;

      if (isNaN(val)) {
        showModal('請輸入答案', `請先在【${pal.label}】的格子中輸入計算出的面積！`, 'info');
        return;
      }

      const fracText = slot.fraction === 1 ? '1 (整圓)' : slot.fraction === 0.5 ? '1/2 (半圓)' : '1/4 (四分之一圓)';
      const exact = r * r * 3.14 * slot.fraction;

      if (Math.abs(val - exact) < 0.2) {
        m.isSolved = true;
        updateFarmUI();
        showModal(
          `🎉 ${pal.label} 算對了！`,
          `位置：${slot.name}（${fracText}）\n繩長半徑：${r} m\n算式：${r} × ${r} × 3.14 × ${slot.fraction} = ${exact.toFixed(2)} m²`,
          'success'
        );
      } else {
        m.isSolved = false;
        updateFarmUI();
        showModal(
          `${pal.label} 再算算看`,
          `【解題提示】\n1. ${pal.label}位於「${slot.name}」，活動範圍是 ${fracText}\n2. 繩長半徑為 ${r} m\n3. 先算整圓面積（${r} × ${r} × 3.14），再乘上圓的比例喔！`,
          'error'
        );
      }
    }

    function handleComparePickChange(index, val) {
      studentComparePicks[index] = val;
    }

    function handleCompareOpChange(index, val) {
      studentCompareOps[index] = val;
    }

    function verifyMouseOrder() {
      const n = farmMice.length;
      if (n < 2) return;

      const picks = studentComparePicks.slice(0, n);
      if (picks.some(p => !p)) {
        showModal('尚未選完', '請在每個下拉選單中都選好對應的小立鼠再核對喔！', 'info');
        return;
      }

      const uniqueCount = new Set(picks).size;
      if (uniqueCount < n) {
        showModal('選項重複了', '同一隻小立鼠不能重複選取兩次喔，請檢查一下下拉選單！', 'error');
        return;
      }

      // 取得學生選擇的每一項對應的實際面積（僅用於背景驗證，不直接顯示面積數值）
      const chosenDetails = picks.map(id => {
        const m = farmMice.find(item => item.id === id);
        const pal = MOUSE_PALETTES[m.paletteIdx];
        const slot = slots[m.slotKey];
        const r = m.ropeRadiusM;
        const area = r * r * 3.14 * slot.fraction;
        return { m, pal, slot, r, area };
      });

      let isAllCorrect = true;
      for (let i = 0; i < n - 1; i++) {
        const leftArea = chosenDetails[i].area;
        const rightArea = chosenDetails[i + 1].area;
        const op = studentCompareOps[i];
        const isEqual = Math.abs(leftArea - rightArea) < 0.01;

        if (op === '>') {
          if (leftArea <= rightArea + 0.01) {
            isAllCorrect = false;
            break;
          }
        } else if (op === '=') {
          if (!isEqual) {
            isAllCorrect = false;
            break;
          }
        }
      }

      if (isAllCorrect) {
        let relationChain = '';
        for (let i = 0; i < chosenDetails.length; i++) {
          const d = chosenDetails[i];
          relationChain += `${d.pal.label}（${d.slot.name}，繩長 ${d.r}m）`;
          if (i < chosenDetails.length - 1) {
            relationChain += `  ${studentCompareOps[i]}  `;
          }
        }

        showModal(
          '🎉 大小順序完全正確！',
          `太棒了！你的比較結果完全正確：\n\n${relationChain}\n\n接下來請自己動手算算看，它們的活動面積分別是多少平方公尺，並填進下方的格子裡核對吧！`,
          'success'
        );
      } else {
        showModal(
          '順序不太對喔，再想想看！',
          '【比較小提示】\n1. 先讓小立鼠繞一圈，再把產生的扇形色塊拖到右邊重疊比比看大小。\n2. 觀察繩長（半徑）和木樁位置（整圓、半圓、1/4圓）的變化喔！',
          'error'
        );
      }
    }

    function updateFarmUI() {
      if (currentMode !== 'farm_inside') return;
      const m = getActiveMouse();
      if (!m) return;
      const slot = slots[m.slotKey];

      // 1. 渲染上方小立鼠分頁籤
      const containerEl = document.getElementById('mouseTabsContainer');
      containerEl.innerHTML = '';
      farmMice.forEach(mouse => {
        const pal = MOUSE_PALETTES[mouse.paletteIdx];
        const isSelected = mouse.id === activeMouseId;
        const mSlot = slots[mouse.slotKey];
        const shortPos = mSlot ? mSlot.name.replace('正', '') : '';

        const tab = document.createElement('div');
        tab.onclick = () => selectFarmMouse(mouse.id);
        tab.className = `flex items-center space-x-1.5 px-2.5 py-1 rounded-lg text-xs font-bold cursor-pointer transition select-none ${
          isSelected
            ? 'bg-slate-700 text-white ring-1 ring-amber-400 shadow-sm'
            : 'text-slate-400 hover:text-slate-200 hover:bg-slate-800/70'
        }`;

        tab.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full inline-block flex-shrink-0" style="background-color: ${pal.dotColor};"></span>
          <span>${pal.label}<span class="text-[10px] font-normal opacity-80 ml-0.5">(${shortPos})</span></span>
          ${farmMice.length > 1 ? `<button onclick="removeFarmMouse('${mouse.id}', event)" class="ml-1 text-slate-400 hover:text-rose-400 px-0.5 rounded" title="刪除此小立鼠"><i class="fa-solid fa-xmark text-[11px]"></i></button>` : ''}
        `;
        containerEl.appendChild(tab);
      });

      const addBtn = document.getElementById('addMouseBtn');
      if (farmMice.length >= 3) {
        addBtn.classList.add('opacity-40', 'pointer-events-none');
      } else {
        addBtn.classList.remove('opacity-40', 'pointer-events-none');
      }

      // 2. 更新位置按鈕高亮
      document.querySelectorAll('.pos-btn').forEach(b => b.className = "pos-btn px-2.5 py-1 text-xs font-semibold rounded-lg text-slate-300 hover:text-white transition");
      if (slot) {
        const activeBtn = document.getElementById(`btn_${slot.type}`);
        if (activeBtn) activeBtn.className = "pos-btn px-2.5 py-1 text-xs font-semibold rounded-lg bg-blue-600 text-white shadow-sm transition";
      }

      // 3. 更新繩長滑桿與文字
      const slider = document.getElementById('ropeSlider');
      slider.value = m.ropeRadiusM;
      document.getElementById('ropeValueText').innerText = `${m.ropeRadiusM} m`;

      // 4. 渲染底部「三隻小立鼠各自計算卡」
      const calcListEl = document.getElementById('miceCalcList');
      calcListEl.innerHTML = '';
      farmMice.forEach(mouse => {
        const pal = MOUSE_PALETTES[mouse.paletteIdx];
        const mSlot = slots[mouse.slotKey];
        const posLabel = mSlot ? mSlot.name.replace('正', '') : '';
        const isSelected = mouse.id === activeMouseId;

        const card = document.createElement('div');
        card.onclick = () => selectFarmMouse(mouse.id);
        card.className = `flex items-center space-x-2 px-3 py-1.5 rounded-xl border transition cursor-pointer ${
          isSelected
            ? 'bg-slate-800 ' + pal.borderCls + ' ring-1 ring-amber-400/60'
            : 'bg-slate-900/85 border-slate-700/80 hover:bg-slate-800/70'
        }`;

        card.innerHTML = `
          <span class="w-2.5 h-2.5 rounded-full flex-shrink-0" style="background-color: ${pal.dotColor};"></span>
          <span class="font-bold text-slate-200 whitespace-nowrap">${pal.label}<span class="text-[11px] text-slate-400 font-normal ml-1">(${posLabel}·${mouse.ropeRadiusM}m)</span>：</span>
          <input type="number" step="0.01" value="${mouse.userInput}" placeholder="填寫面積"
            onclick="event.stopPropagation(); selectFarmMouse('${mouse.id}')"
            oninput="handleMouseInputChange('${mouse.id}', this.value)"
            onkeydown="if(event.key==='Enter') verifySingleMouseAnswer('${mouse.id}')"
            class="bg-slate-950 border ${mouse.isSolved ? 'border-emerald-500 text-emerald-300' : 'border-slate-600 text-amber-300'} rounded-lg px-2.5 py-1 text-xs md:text-sm font-mono w-24 focus:outline-none focus:border-amber-400">
          <span class="text-xs text-slate-400 font-mono">m²</span>
          <button onclick="event.stopPropagation(); verifySingleMouseAnswer('${mouse.id}')"
            class="${mouse.isSolved ? 'bg-emerald-600' : 'bg-blue-600 hover:bg-blue-500'} text-white font-bold px-2.5 py-1 rounded-lg text-xs transition shadow-sm">
            ${mouse.isSolved ? '<i class="fa-solid fa-check"></i> 已對' : '核對'}
          </button>
        `;
        calcListEl.appendChild(card);
      });

      // 5. 渲染底部「學生下拉式選單大小比較列」
      const compareBar = document.getElementById('miceCompareBar');
      const dropdownsContainer = document.getElementById('compareDropdownsContainer');

      if (farmMice.length >= 2) {
        compareBar.classList.remove('hidden');
        compareBar.classList.add('flex');
        dropdownsContainer.innerHTML = '';

        for (let i = 0; i < farmMice.length; i++) {
          const selectEl = document.createElement('select');
          selectEl.onchange = (e) => handleComparePickChange(i, e.target.value);
          selectEl.className = 'bg-slate-950 text-amber-200 font-bold border border-slate-600 rounded-lg px-2.5 py-1 text-xs md:text-sm focus:outline-none focus:border-amber-400 cursor-pointer';

          const defaultOpt = document.createElement('option');
          defaultOpt.value = '';
          defaultOpt.textContent = `-- 選擇第 ${i + 1} 個 --`;
          selectEl.appendChild(defaultOpt);

          farmMice.forEach(mouse => {
            const pal = MOUSE_PALETTES[mouse.paletteIdx];
            const mSlot = slots[mouse.slotKey];
            const posText = mSlot ? mSlot.name.replace('正', '') : '';
            const opt = document.createElement('option');
            opt.value = mouse.id;
            opt.textContent = `${pal.label} (${posText})`;
            if (studentComparePicks[i] === mouse.id) {
              opt.selected = true;
            }
            selectEl.appendChild(opt);
          });

          dropdownsContainer.appendChild(selectEl);

          if (i < farmMice.length - 1) {
            const opSelect = document.createElement('select');
            opSelect.onchange = (e) => handleCompareOpChange(i, e.target.value);
            opSelect.className = 'bg-slate-800 text-amber-400 font-extrabold border border-amber-500/40 rounded-lg px-2 py-1 text-xs md:text-sm focus:outline-none cursor-pointer';

            ['>', '='].forEach(sym => {
              const opOpt = document.createElement('option');
              opOpt.value = sym;
              opOpt.textContent = sym;
              if (studentCompareOps[i] === sym) {
                opOpt.selected = true;
              }
              opSelect.appendChild(opOpt);
            });

            dropdownsContainer.appendChild(opSelect);
          }
        }
      } else {
        compareBar.classList.remove('flex');
        compareBar.classList.add('hidden');
      }
    }

    // --- 題型二：司令台障礙物 ---
    const BARN_W_M = 10;
    const BARN_H_M = 8;
    let barnDifficulty = 'basic';
    let barnRect = { x: 0, y: 0, w: 0, h: 0 };
    let barnPegP0 = { x: 0, y: 0 };
    let barnCornerC = { x: 0, y: 0 };
    let cowParamT = 0;
    let barnMaxSweptT = 0;

    let draggableSlices = [];

    function updateResetSliceBtnState() {
      const btn = document.getElementById('resetSliceBtn');
      if (draggableSlices.length > 0) {
        btn.classList.remove('opacity-50', 'pointer-events-none');
      } else {
        btn.classList.add('opacity-50', 'pointer-events-none');
      }
    }

    function updateStepIndicator(step) {
      if (currentMode !== 'barn_obstacle') return;
      const s1 = document.getElementById('step1Badge');
      const s2 = document.getElementById('step2Badge');
      const s3 = document.getElementById('step3Badge');
      if (!s1 || !s2 || !s3) return;

      const activeCls = 'px-2 py-0.5 rounded-md font-bold bg-amber-500 text-slate-950 transition';
      const inactiveCls = 'px-2 py-0.5 rounded-md text-slate-400 transition';

      s1.className = step === 1 ? activeCls : inactiveCls;
      s2.className = step === 2 ? activeCls : inactiveCls;
      s3.className = step === 3 ? activeCls : inactiveCls;
    }

    function initGrassTufts(width, height) {
      grassTufts = [];
      const count = Math.floor((width * height) / 12000);
      for (let i = 0; i < count; i++) {
        grassTufts.push({
          x: Math.random() * width,
          y: Math.random() * height,
          scale: 0.7 + Math.random() * 0.5
        });
      }
    }

    function initSlots() {
      const left = farmRect.x;
      const right = farmRect.x + farmRect.w;
      const top = farmRect.y;
      const bottom = farmRect.y + farmRect.h;
      const cx = farmRect.x + farmRect.w / 2;
      const cy = farmRect.y + farmRect.h / 2;

      slots = {
        center: { id: 'center', type: 'center', name: '正中央', x: cx, y: cy, minAng: -Math.PI, maxAng: Math.PI, fraction: 1, maxR: 4, minR: 1, step: 1 },
        top_edge: { id: 'top_edge', type: 'edge', name: '上邊界', x: cx, y: top, minAng: 0, maxAng: Math.PI, fraction: 0.5, maxR: 4, minR: 1, step: 1 },
        bottom_edge: { id: 'bottom_edge', type: 'edge', name: '下邊界', x: cx, y: bottom, minAng: -Math.PI, maxAng: 0, fraction: 0.5, maxR: 4, minR: 1, step: 1 },
        left_edge: { id: 'left_edge', type: 'edge', name: '左邊界', x: left, y: cy, minAng: -Math.PI / 2, maxAng: Math.PI / 2, fraction: 0.5, maxR: 4, minR: 1, step: 1 },
        right_edge: { id: 'right_edge', type: 'edge', name: '右邊界', x: right, y: cy, minAng: Math.PI / 2, maxAng: 1.5 * Math.PI, fraction: 0.5, maxR: 4, minR: 1, step: 1 },
        top_left: { id: 'top_left', type: 'corner', name: '左上角', x: left, y: top, minAng: 0, maxAng: Math.PI / 2, fraction: 0.25, maxR: 4, minR: 1, step: 1 },
        top_right: { id: 'top_right', type: 'corner', name: '右上角', x: right, y: top, minAng: Math.PI / 2, maxAng: Math.PI, fraction: 0.25, maxR: 4, minR: 1, step: 1 },
        bottom_left: { id: 'bottom_left', type: 'corner', name: '左下角', x: left, y: bottom, minAng: -Math.PI / 2, maxAng: 0, fraction: 0.25, maxR: 4, minR: 1, step: 1 },
        bottom_right: { id: 'bottom_right', type: 'corner', name: '右下角', x: right, y: bottom, minAng: -Math.PI, maxAng: -Math.PI / 2, fraction: 0.25, maxR: 4, minR: 1, step: 1 }
      };
    }

    function resizeCanvas() {
      const rect = container.getBoundingClientRect();
      const w = rect.width;
      const h = rect.height;

      if (!w || !h || w < 50 || h < 50) return;

      const dpr = window.devicePixelRatio || 1;
      canvas.width = w * dpr;
      canvas.height = h * dpr;
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';

      ctx.resetTransform();
      ctx.scale(dpr, dpr);

      initGrassTufts(w, h);

      const halfW = w * 0.50;

      if (currentMode === 'farm_inside') {
        const paddingLeft = 85;
        const paddingRight = 25;
        const paddingTop = 45;
        const paddingBottom = 25;
        const availableW = Math.max(100, halfW - paddingLeft - paddingRight);
        const availableH = Math.max(100, h - paddingTop - paddingBottom);
        meterScale = Math.min(availableW / FARM1_W_M, availableH / FARM1_H_M);

        farmRect.w = FARM1_W_M * meterScale;
        farmRect.h = FARM1_H_M * meterScale;
        farmRect.x = paddingLeft + (availableW - farmRect.w) / 2;
        farmRect.y = paddingTop + (availableH - farmRect.h) / 2;

        initSlots();

        farmMice.forEach(m => {
          const slot = slots[m.slotKey] || slots['center'];
          m.pegX = slot.x;
          m.pegY = slot.y;
          const slice = draggableSlices.find(s => s.ownerMouseId === m.id);
          if (slice) {
            const wasAtHome = Math.hypot(slice.x - slice.homeX, slice.y - slice.homeY) < 5;
            slice.homeX = slot.x;
            slice.homeY = slot.y;
            slice.rPx = m.ropeRadiusM * meterScale;
            if (wasAtHome) {
              slice.x = slot.x;
              slice.y = slot.y;
            }
          }
        });
      } else {
        const rMax = 10;
        const spanW_M = rMax + BARN_W_M;
        const spanH_M = rMax + (BARN_H_M + 2.5);

        const padX = 35;
        const padY = 55;
        const availW = Math.max(100, halfW - padX * 2);
        const availH = Math.max(100, h - padY * 2);

        meterScale = Math.min(availW / spanW_M, availH / spanH_M);

        barnRect.w = BARN_W_M * meterScale;
        barnRect.h = BARN_H_M * meterScale;

        const minPegX = padX + rMax * meterScale;
        const maxPegX = halfW - padX - barnRect.w;
        barnPegP0.x = minPegX + Math.max(0, (maxPegX - minPegX) / 2);

        const minPegY = padY + rMax * meterScale;
        const maxPegY = h - padY - (barnRect.h + 2 * meterScale);
        barnPegP0.y = minPegY + Math.max(0, (maxPegY - minPegY) / 2);

        barnRect.x = barnPegP0.x;
        barnRect.y = barnPegP0.y;
        barnCornerC = { x: barnRect.x, y: barnRect.y + barnRect.h };
      }

      syncDraggableSlices();
      render();
    }

    function syncDraggableSlices() {
      if (currentMode === 'farm_inside') {
        farmMice.forEach(m => {
          const slot = slots[m.slotKey];
          if (!slot) return;
          let totalRad = 0;
          m.sweptIntervals.forEach(([s, e]) => totalRad += (e - s));
          const maxSpan = slot.maxAng - slot.minAng;
          const completed = slot.fraction === 1
            ? (totalRad >= maxSpan * 0.995 && m.sweptIntervals.length === 1)
            : (totalRad >= maxSpan * 0.995);

          const sliceId = 'farm_slice_' + m.id;
          if (completed && !draggableSlices.some(s => s.id === sliceId)) {
            const pal = MOUSE_PALETTES[m.paletteIdx];
            draggableSlices.push({
              id: sliceId,
              ownerMouseId: m.id,
              name: pal.label,
              rM: m.ropeRadiusM,
              showRadiusLabel: true,
              homeX: m.pegX,
              homeY: m.pegY,
              x: m.pegX,
              y: m.pegY,
              rPx: m.ropeRadiusM * meterScale,
              minAng: slot.minAng,
              maxAng: slot.maxAng,
              fraction: slot.fraction,
              fillColor: pal.sliceFill,
              strokeColor: pal.stroke
            });
          }
        });
        updateResetSliceBtnState();
      } else {
        if (barnMaxSweptT >= 0.745 && ropeRadiusM > 0) {
          if (!draggableSlices.some(s => s.id === 'barn_main_slice')) {
            draggableSlices.push({
              id: 'barn_main_slice',
              name: '',
              rM: ropeRadiusM,
              showRadiusLabel: true,
              homeX: barnPegP0.x,
              homeY: barnPegP0.y,
              x: barnPegP0.x,
              y: barnPegP0.y,
              rPx: ropeRadiusM * meterScale,
              minAng: -1.5 * Math.PI,
              maxAng: 0,
              fraction: 0.75,
              fillColor: 'rgba(52, 211, 153, 0.75)',
              strokeColor: '#10b981'
            });
            updateResetSliceBtnState();
            updateStepIndicator(3);
          }
        }

        if (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M && barnMaxSweptT >= 0.985) {
          if (!draggableSlices.some(s => s.id === 'barn_sub_slice')) {
            const remRadiusM = ropeRadiusM - BARN_H_M;
            const remRadius = remRadiusM * meterScale;
            draggableSlices.push({
              id: 'barn_sub_slice',
              name: '',
              rM: remRadiusM,
              showRadiusLabel: true,
              homeX: barnCornerC.x,
              homeY: barnCornerC.y,
              x: barnCornerC.x,
              y: barnCornerC.y,
              rPx: remRadius,
              minAng: 0,
              maxAng: 0.5 * Math.PI,
              fraction: 0.25,
              fillColor: 'rgba(251, 191, 36, 0.85)',
              strokeColor: '#f59e0b'
            });
          }
        }
      }
    }

    function resetExtractedSlices() {
      draggableSlices.forEach(s => {
        s.x = s.homeX;
        s.y = s.homeY;
      });
      render();
    }

    function applySlotToMouse(mouse, key, resetSweep = true, resetAngle = true) {
      if (!mouse) return;
      mouse.slotKey = key;
      const slot = slots[key];
      if (!slot) return;

      mouse.pegX = slot.x;
      mouse.pegY = slot.y;
      mouse.isSolved = false;

      if (resetAngle) {
        mouse.cowAngle = (slot.minAng + slot.maxAng) / 2;
      } else {
        mouse.cowAngle = clampAngleForSlot(slot, mouse.cowAngle);
      }
      mouse.prevCowAngle = mouse.cowAngle;

      if (resetSweep) {
        mouse.sweptIntervals = [];
        draggableSlices = draggableSlices.filter(s => s.ownerMouseId !== mouse.id);
        updateResetSliceBtnState();
        document.getElementById('canvasHintText').innerHTML = `拖曳木樁📍可吸附至藍點；按住小立鼠${MOUSE_ICON_HTML}繞完後，可將色塊拉至右側比對！`;
      }

      updateFarmUI();
    }

    function setSlotPreset(key) {
      const m = getActiveMouse();
      if (!m) return;
      applySlotToMouse(m, key, true, true);
      render();
    }

    function setBarnDifficulty(diff) {
      barnDifficulty = diff;
      const bBasic = document.getElementById('btn_barn_basic');
      const bAdv = document.getElementById('btn_barn_adv');

      if (diff === 'basic') {
        bBasic.className = "barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg bg-amber-600 text-white shadow-sm transition";
        bAdv.className = "barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg text-slate-300 hover:text-white transition";
        document.getElementById('statusLessonText2').innerText = '司令台角落 (基礎)';
      } else {
        bAdv.className = "barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg bg-amber-600 text-white shadow-sm transition";
        bBasic.className = "barn-diff-btn px-3 py-1 text-xs font-bold rounded-lg text-slate-300 hover:text-white transition";
        document.getElementById('statusLessonText2').innerText = '司令台角落 (進階)';
      }

      resetCanvas();
      resizeCanvas();
    }

    function switchLessonMode(mode) {
      currentMode = mode;
      const sizeBadge = document.getElementById('sizeBadge');
      const ctrls1 = document.getElementById('ctrls_mode1');
      const ctrls2 = document.getElementById('ctrls_mode2');
      const bottom1 = document.getElementById('bottomCalc_mode1');
      const bottom2 = document.getElementById('bottomCalc_mode2');
      const slider = document.getElementById('ropeSlider');
      const stepGroup = document.getElementById('stepIndicatorGroup');
      const autoWalkText = document.getElementById('autoWalkBtnText');

      if (mode === 'farm_inside') {
        sizeBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-2"></span>草地：長 <b class="text-amber-400 mx-0.5">16m</b> × 寬 <b class="text-amber-400 mx-0.5">10m</b>';
        ctrls1.classList.remove('hidden'); ctrls1.classList.add('flex');
        ctrls2.classList.remove('flex'); ctrls2.classList.add('hidden');
        bottom1.classList.remove('hidden'); bottom1.classList.add('flex');
        bottom2.classList.remove('flex'); bottom2.classList.add('hidden');
        slider.classList.remove('hidden');
        stepGroup.classList.remove('flex'); stepGroup.classList.add('hidden');
        slider.min = 1; slider.max = 4; slider.step = 1;
        autoWalkText.innerText = '全部走一圈';

        if (farmMice.length === 0) {
          initDefaultFarmMice();
        }
        updateFarmUI();
        resizeCanvas();
        farmMice.forEach(m => applySlotToMouse(m, m.slotKey, true, true));
        render();
      } else {
        sizeBadge.innerHTML = '<span class="inline-block w-2 h-2 rounded-full bg-amber-400 mr-2"></span>司令台：長 <b class="text-amber-400 mx-0.5">10m</b> × 寬 <b class="text-amber-400 mx-0.5">8m</b>';
        ctrls1.classList.remove('flex'); ctrls1.classList.add('hidden');
        ctrls2.classList.remove('hidden'); ctrls2.classList.add('flex');
        bottom1.classList.remove('flex'); bottom1.classList.add('hidden');
        bottom2.classList.remove('hidden'); bottom2.classList.add('flex');
        slider.classList.add('hidden');
        stepGroup.classList.remove('hidden'); stepGroup.classList.add('flex');
        autoWalkText.innerText = '自動走一圈';
        setBarnDifficulty('basic');
      }
    }

    function handleRopeChange(val) {
      const r = Math.round(parseFloat(val));
      if (currentMode === 'farm_inside') {
        const m = getActiveMouse();
        if (!m) return;
        m.ropeRadiusM = r;
        m.sweptIntervals = [];
        m.prevCowAngle = null;
        m.isSolved = false;
        draggableSlices = draggableSlices.filter(s => s.ownerMouseId !== m.id);
        updateResetSliceBtnState();
        updateFarmUI();
        const pal = MOUSE_PALETTES[m.paletteIdx];
        document.getElementById('canvasHintText').innerHTML = `${pal.label}繩長已變更為 ${r}m，請重新拖曳小立鼠${MOUSE_ICON_HTML}繞行活動！`;
      } else {
        ropeRadiusM = r;
        document.getElementById('ropeValueText').innerText = `${ropeRadiusM} m`;
        document.getElementById('statusRopeText2').innerText = `${ropeRadiusM} m`;
        barnMaxSweptT = 0;
        draggableSlices = [];
        updateResetSliceBtnState();
      }
      render();
    }

    function resetCanvas() {
      draggableSlices = [];
      updateResetSliceBtnState();

      if (currentMode === 'farm_inside') {
        studentComparePicks = ['', '', ''];
        studentCompareOps = ['>', '>'];
        farmMice.forEach(m => {
          m.sweptIntervals = [];
          m.prevCowAngle = null;
          m.userInput = '';
          m.isSolved = false;
          const slot = slots[m.slotKey];
          if (slot) m.cowAngle = (slot.minAng + slot.maxAng) / 2;
        });
        updateFarmUI();
        document.getElementById('canvasHintText').innerHTML = `可點上方「+新增」比較多隻小立鼠${MOUSE_ICON_HTML}；繞完後將色塊拖至右側比對大小！`;
      } else {
        barnMaxSweptT = 0;
        cowParamT = 0;
        barnCornerBlocked = false;
        barnExploreStage = 'stretch';
        ropeRadiusM = 0;
        document.getElementById('ropeValueText').innerText = '0 m';
        document.getElementById('statusRopeText2').innerText = '0 m';
        document.getElementById('canvasHintText').innerHTML = `👉 步驟 1：按住小立鼠${MOUSE_ICON_HTML}往右拉直繩子，決定要拉多長！`;
        updateStepIndicator(1);
      }

      render();
    }

    function clampAngleForSlot(slot, rawAng) {
      if (!slot || slot.fraction === 1) return rawAng;

      const sid = slot.id;
      if (sid === 'top_edge') {
        if (rawAng < 0) return (rawAng > -Math.PI / 2) ? 0 : Math.PI;
        return Math.max(0, Math.min(Math.PI, rawAng));
      } else if (sid === 'bottom_edge') {
        if (rawAng > 0) return (rawAng < Math.PI / 2) ? 0 : -Math.PI;
        return Math.max(-Math.PI, Math.min(0, rawAng));
      } else if (sid === 'left_edge') {
        if (rawAng > Math.PI / 2) return Math.PI / 2;
        if (rawAng < -Math.PI / 2) return -Math.PI / 2;
        return rawAng;
      } else if (sid === 'right_edge') {
        let a = rawAng;
        if (a < 0) a += Math.PI * 2;
        if (a < Math.PI / 2) return Math.PI / 2;
        if (a > 1.5 * Math.PI) return 1.5 * Math.PI;
        return a;
      } else if (sid === 'top_left') {
        if (rawAng < 0) return 0;
        if (rawAng > Math.PI / 2) return Math.PI / 2;
        return rawAng;
      } else if (sid === 'top_right') {
        if (rawAng < 0) return (rawAng > -Math.PI / 2) ? Math.PI / 2 : Math.PI;
        if (rawAng < Math.PI / 2) return Math.PI / 2;
        if (rawAng > Math.PI) return Math.PI;
        return rawAng;
      } else if (sid === 'bottom_left') {
        if (rawAng > 0) return (rawAng < Math.PI / 2) ? 0 : -Math.PI / 2;
        if (rawAng < -Math.PI / 2) return -Math.PI / 2;
        return rawAng;
      } else if (sid === 'bottom_right') {
        if (rawAng > 0) return (rawAng > Math.PI / 2) ? -Math.PI : -Math.PI / 2;
        if (rawAng > -Math.PI / 2) return -Math.PI / 2;
        if (rawAng < -Math.PI) return -Math.PI;
        return rawAng;
      }
      return rawAng;
    }

    function addSweepIntervalForMouse(mouse, ang1, ang2) {
      const slot = slots[mouse.slotKey];
      if (!slot) return;
      let minA = Math.min(ang1, ang2);
      let maxA = Math.max(ang1, ang2);

      if (slot.fraction === 1 && (maxA - minA) > Math.PI) {
        addSingleIntervalForMouse(mouse, maxA, Math.PI);
        addSingleIntervalForMouse(mouse, -Math.PI, minA);
      } else {
        addSingleIntervalForMouse(mouse, Math.max(slot.minAng, minA), Math.min(slot.maxAng, maxA));
      }
    }

    function addSingleIntervalForMouse(mouse, s, e) {
      if (s >= e) return;
      mouse.sweptIntervals.push([s, e]);
      mouse.sweptIntervals.sort((a, b) => a[0] - b[0]);
      const merged = [];
      for (let seg of mouse.sweptIntervals) {
        if (!merged.length) merged.push([...seg]);
        else {
          let prev = merged[merged.length - 1];
          if (seg[0] <= prev[1] + 0.05) {
            prev[1] = Math.max(prev[1], seg[1]);
          } else {
            merged.push([...seg]);
          }
        }
      }

      const slot = slots[mouse.slotKey];
      if (slot && slot.fraction === 1 && merged.length > 1) {
        const first = merged[0];
        const last = merged[merged.length - 1];
        if (first[0] <= -Math.PI + 0.05 && last[1] >= Math.PI - 0.05) {
          const span = (first[1] - first[0]) + (last[1] - last[0]);
          if (span >= Math.PI * 2 - 0.08 && merged.length === 2) {
            mouse.sweptIntervals = [[-Math.PI, Math.PI]];
            return;
          }
        }
      }

      mouse.sweptIntervals = merged;
    }

    function autoWalkCircle() {
      if (currentMode === 'barn_obstacle' && ropeRadiusM === 0) {
        showModal('請先拉出半徑', '請先按住小立鼠往右拉出繩長半徑，再點擊「自動走一圈」喔！', 'info');
        return;
      }

      draggableSlices = [];
      updateResetSliceBtnState();
      barnCornerBlocked = false;

      if (currentMode === 'farm_inside') {
        farmMice.forEach(m => {
          m.sweptIntervals = [];
        });

        let progress = 0;
        function stepAllMice() {
          if (progress <= 1) {
            farmMice.forEach(m => {
              const slot = slots[m.slotKey];
              if (!slot) return;
              const cur = slot.minAng + (slot.maxAng - slot.minAng) * progress;
              m.cowAngle = cur;
              addSingleIntervalForMouse(m, slot.minAng, cur);
            });
            progress += 0.015;
            render();
            requestAnimationFrame(stepAllMice);
          } else {
            farmMice.forEach(m => {
              const slot = slots[m.slotKey];
              if (!slot) return;
              m.cowAngle = slot.maxAng;
              addSingleIntervalForMouse(m, slot.minAng, slot.maxAng);
            });
            syncDraggableSlices();
            render();
          }
        }
        stepAllMice();
      } else {
        barnMaxSweptT = 0;
        barnExploreStage = 'walk';
        updateStepIndicator(2);
        cowParamT = 0;
        const targetMax = (barnDifficulty === 'basic' || ropeRadiusM <= BARN_H_M) ? 0.75 : 1.0;
        
        function step2() {
          if (cowParamT < targetMax) {
            cowParamT += 0.005;
            barnMaxSweptT = cowParamT;
            syncDraggableSlices();
            render();
            requestAnimationFrame(step2);
          } else {
            cowParamT = targetMax;
            barnMaxSweptT = targetMax;
            syncDraggableSlices();
            render();
          }
        }
        step2();
      }
    }

    function render() {
      const rect = container.getBoundingClientRect();
      if (!rect || rect.width < 50) return;
      ctx.clearRect(0, 0, rect.width, rect.height);

      ctx.fillStyle = '#528d44';
      ctx.fillRect(0, 0, rect.width, rect.height);
      drawGrassTufts();

      drawRightDividerOnly(rect.width, rect.height);

      if (currentMode === 'farm_inside') {
        renderFarmInside();
      } else {
        renderBarnObstacle();
      }

      if (draggableSlices.length > 0) {
        drawDraggableSlices();
      }
    }

    function drawGrassTufts() {
      ctx.save();
      grassTufts.forEach(g => {
        ctx.save();
        ctx.translate(g.x, g.y);
        ctx.scale(g.scale, g.scale);
        ctx.strokeStyle = '#3d6f31';
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.moveTo(0, 0); ctx.quadraticCurveTo(-4, -8, -7, -9);
        ctx.moveTo(0, 0); ctx.quadraticCurveTo(0, -9, 0, -12);
        ctx.moveTo(0, 0); ctx.quadraticCurveTo(4, -8, 7, -9);
        ctx.stroke();
        ctx.restore();
      });
      ctx.restore();
    }

    function drawRightDividerOnly(totalW, totalH) {
      const dividerX = totalW * 0.50;
      ctx.save();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.setLineDash([6, 6]);
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(dividerX, 15);
      ctx.lineTo(dividerX, totalH - 15);
      ctx.stroke();
      ctx.restore();
    }

    function renderFarmInside() {
      ctx.strokeStyle = '#8d5b2d';
      ctx.lineWidth = 8;
      ctx.strokeRect(farmRect.x, farmRect.y, farmRect.w, farmRect.h);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'bottom';
      ctx.fillText('長: 16m', farmRect.x + farmRect.w / 2, farmRect.y - 12);

      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      const labelX = farmRect.x - 70;
      const labelY = farmRect.y + farmRect.h / 2;
      
      ctx.save();
      ctx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      ctx.roundRect(labelX - 6, labelY - 12, 64, 24, 6);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
      ctx.lineWidth = 1;
      ctx.stroke();
      ctx.restore();

      ctx.fillStyle = '#f8fafc';
      ctx.fillText('寬: 10m', labelX, labelY);

      Object.values(slots).forEach(s => {
        ctx.beginPath();
        ctx.arc(s.x, s.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#1e40af';
        ctx.fill();
        ctx.strokeStyle = '#93c5fd';
        ctx.lineWidth = 1.8;
        ctx.stroke();
      });

      const orderedMice = [...farmMice].sort((a, b) => (a.id === activeMouseId ? 1 : b.id === activeMouseId ? -1 : 0));

      orderedMice.forEach(m => {
        const pal = MOUSE_PALETTES[m.paletteIdx];
        const rPx = m.ropeRadiusM * meterScale;
        if (m.sweptIntervals.length > 0) {
          ctx.save();
          ctx.fillStyle = pal.sweepFill;
          m.sweptIntervals.forEach(([s, e]) => {
            ctx.beginPath();
            ctx.moveTo(m.pegX, m.pegY);
            ctx.arc(m.pegX, m.pegY, rPx, s, e, false);
            ctx.closePath();
            ctx.fill();
          });
          ctx.restore();
        }
      });

      orderedMice.forEach(m => {
        const pal = MOUSE_PALETTES[m.paletteIdx];
        const isSelected = m.id === activeMouseId;
        const rPx = m.ropeRadiusM * meterScale;
        const cowX = m.pegX + Math.cos(m.cowAngle) * rPx;
        const cowY = m.pegY + Math.sin(m.cowAngle) * rPx;

        ctx.beginPath();
        ctx.moveTo(m.pegX, m.pegY);
        ctx.lineTo(cowX, cowY);
        ctx.strokeStyle = isSelected ? '#ffffff' : 'rgba(255, 255, 255, 0.75)';
        ctx.lineWidth = isSelected ? 3.5 : 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(m.pegX, m.pegY, isSelected ? 10 : 8, 0, Math.PI * 2);
        ctx.fillStyle = pal.dotColor;
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#ffffff' : '#0f172a';
        ctx.lineWidth = isSelected ? 3 : 2;
        ctx.stroke();

        if (isSelected) {
          ctx.beginPath();
          ctx.arc(cowX, cowY, 27, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.85)';
          ctx.lineWidth = 2.5;
          ctx.setLineDash([4, 3]);
          ctx.stroke();
          ctx.setLineDash([]);
        }

        drawLittleSquirrel(cowX, cowY, m.cowAngle + Math.PI / 2);

        ctx.save();
        const tagText = `${pal.label} (${m.ropeRadiusM}m)`;
        ctx.font = 'bold 11px sans-serif';
        const tw = ctx.measureText(tagText).width + 10;
        const th = 18;
        const tx = cowX - tw / 2;
        const ty = cowY - 38;

        ctx.fillStyle = pal.badgeBg;
        ctx.beginPath();
        ctx.roundRect(tx, ty, tw, th, 5);
        ctx.fill();
        ctx.strokeStyle = isSelected ? '#fde047' : 'rgba(255,255,255,0.5)';
        ctx.lineWidth = isSelected ? 1.5 : 1;
        ctx.stroke();

        ctx.fillStyle = '#ffffff';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(tagText, cowX, ty + th / 2);
        ctx.restore();
      });
    }

    function renderBarnObstacle() {
      const rMainPx = ropeRadiusM * meterScale;

      if (barnMaxSweptT > 0 && ropeRadiusM > 0) {
        ctx.save();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.55)';
        const mainF = Math.min(1.0, barnMaxSweptT / 0.75);
        if (mainF > 0.001) {
          ctx.beginPath();
          ctx.moveTo(barnPegP0.x, barnPegP0.y);
          ctx.arc(barnPegP0.x, barnPegP0.y, rMainPx, 0, -mainF * (1.5 * Math.PI), true);
          ctx.closePath();
          ctx.fill();
        }

        if (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M && barnMaxSweptT > 0.75) {
          const subF = (barnMaxSweptT - 0.75) / 0.25;
          const remRadius = (ropeRadiusM - BARN_H_M) * meterScale;
          ctx.fillStyle = 'rgba(251, 191, 36, 0.72)';
          ctx.beginPath();
          ctx.moveTo(barnCornerC.x, barnCornerC.y);
          ctx.arc(barnCornerC.x, barnCornerC.y, remRadius, 0.5 * Math.PI, 0.5 * Math.PI - subF * (0.5 * Math.PI), true);
          ctx.closePath();
          ctx.fill();
        }
        ctx.restore();
      }

      ctx.save();
      ctx.fillStyle = '#64748b';
      ctx.fillRect(barnRect.x, barnRect.y, barnRect.w, barnRect.h);
      ctx.strokeStyle = '#334155';
      ctx.lineWidth = 4;
      ctx.strokeRect(barnRect.x, barnRect.y, barnRect.w, barnRect.h);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 16px sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText('司 令 台', barnRect.x + barnRect.w / 2, barnRect.y + barnRect.h / 2);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 14px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('長: 10m', barnRect.x + barnRect.w / 2, barnRect.y - 8);
      ctx.textAlign = 'left';
      ctx.fillText('寬: 8m', barnRect.x + barnRect.w + 8, barnRect.y + barnRect.h / 2);
      ctx.restore();

      ctx.beginPath();
      ctx.arc(barnPegP0.x, barnPegP0.y, 8.5, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
      ctx.strokeStyle = '#e0f2fe';
      ctx.lineWidth = 2.5;
      ctx.stroke();

      if (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M) {
        ctx.beginPath();
        ctx.arc(barnCornerC.x, barnCornerC.y, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#f59e0b';
        ctx.fill();
        ctx.strokeStyle = '#fff';
        ctx.lineWidth = 2;
        ctx.stroke();
      }

      if (barnExploreStage === 'stretch') {
        const cowX = barnPegP0.x + ropeRadiusM * meterScale;
        const cowY = barnPegP0.y;

        if (ropeRadiusM > 0) {
          ctx.beginPath();
          ctx.moveTo(barnPegP0.x, barnPegP0.y);
          ctx.lineTo(cowX, cowY);
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 3.5;
          ctx.stroke();

          const midX = (barnPegP0.x + cowX) / 2;
          ctx.save();
          const tStr = `${ropeRadiusM}m`;
          ctx.font = 'bold 13px sans-serif';
          const tw = ctx.measureText(tStr).width + 14;
          ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
          ctx.roundRect(midX - tw / 2, barnPegP0.y - 28, tw, 20, 6);
          ctx.fill();
          ctx.strokeStyle = '#f59e0b';
          ctx.lineWidth = 1;
          ctx.stroke();
          ctx.fillStyle = '#fef08a';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';
          ctx.fillText(tStr, midX, barnPegP0.y - 18);
          ctx.restore();
        }

        drawLittleSquirrel(cowX, cowY, Math.PI / 2);
      } else {
        const state = getBarnKinematics(cowParamT);
        state.segments.forEach(seg => {
          ctx.beginPath();
          ctx.moveTo(seg.x1, seg.y1);
          ctx.lineTo(seg.x2, seg.y2);
          ctx.strokeStyle = '#f8fafc';
          ctx.lineWidth = 3;
          ctx.stroke();
        });

        drawLittleSquirrel(state.cowX, state.cowY, state.heading);
      }
    }

    function drawDraggableSlices() {
      draggableSlices.forEach(slice => {
        ctx.save();
        ctx.beginPath();
        ctx.moveTo(slice.x, slice.y);
        ctx.arc(slice.x, slice.y, slice.rPx, slice.minAng, slice.maxAng, false);
        ctx.closePath();

        ctx.fillStyle = slice.fillColor;
        ctx.fill();
        ctx.strokeStyle = slice.strokeColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(slice.x, slice.y, 6.5, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.strokeStyle = slice.strokeColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        if (slice.showRadiusLabel && slice.rM !== undefined) {
          ctx.save();
          const textStr = slice.name ? `${slice.name} ${slice.rM}m` : `${slice.rM}m`;
          ctx.font = 'bold 12px sans-serif';
          ctx.textAlign = 'center';
          ctx.textBaseline = 'middle';

          if (slice.fraction < 1) {
            const lineAng = slice.minAng;
            const endX = slice.x + Math.cos(lineAng) * slice.rPx;
            const endY = slice.y + Math.sin(lineAng) * slice.rPx;

            ctx.beginPath();
            ctx.moveTo(slice.x, slice.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 3]);
            ctx.stroke();

            const midX = (slice.x + endX) / 2;
            const midY = (slice.y + endY) / 2;
            const outAng = lineAng - Math.PI / 2;
            const labelX = midX + Math.cos(outAng) * 20;
            const labelY = midY + Math.sin(outAng) * 20;

            const tW = ctx.measureText(textStr).width + 12;
            const tH = 20;
            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.beginPath();
            ctx.roundRect(labelX - tW / 2, labelY - tH / 2, tW, tH, 5);
            ctx.fill();
            ctx.strokeStyle = slice.strokeColor;
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = '#fef08a';
            ctx.fillText(textStr, labelX, labelY);
          } else {
            const endX = slice.x + slice.rPx;
            const endY = slice.y;

            ctx.beginPath();
            ctx.moveTo(slice.x, slice.y);
            ctx.lineTo(endX, endY);
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            ctx.lineWidth = 2.5;
            ctx.setLineDash([4, 3]);
            ctx.stroke();

            const labelX = endX + 26;
            const labelY = endY;
            const tW = ctx.measureText(textStr).width + 12;
            const tH = 20;

            ctx.fillStyle = 'rgba(15, 23, 42, 0.92)';
            ctx.beginPath();
            ctx.roundRect(labelX - tW / 2, labelY - tH / 2, tW, tH, 5);
            ctx.fill();
            ctx.strokeStyle = slice.strokeColor;
            ctx.lineWidth = 1.2;
            ctx.stroke();

            ctx.fillStyle = '#fef08a';
            ctx.fillText(textStr, labelX, labelY);
          }
          ctx.restore();
        }

        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 12px sans-serif';
        ctx.textAlign = 'center';
        ctx.shadowColor = 'rgba(0,0,0,0.85)';
        ctx.shadowBlur = 4;
        const dragTextY = slice.fraction <= 0.25 ? (slice.y + slice.rPx + 18) : (slice.y + slice.rPx * 0.65 + 16);
        ctx.fillText('✋ 拖曳比對', slice.x, dragTextY);
        ctx.restore();

        ctx.restore();
      });
    }

    function getBarnKinematics(t) {
      const rMain = ropeRadiusM * meterScale;
      const maxT = (barnDifficulty === 'basic' || ropeRadiusM <= BARN_H_M) ? 0.75 : 1.0;
      const validT = Math.max(0, Math.min(maxT, t));

      if (validT <= 0.75) {
        const alpha = (validT / 0.75) * (1.5 * Math.PI);
        const curCowAngle = -alpha;
        const cowX = barnPegP0.x + Math.cos(curCowAngle) * rMain;
        const cowY = barnPegP0.y + Math.sin(curCowAngle) * rMain;
        return {
          cowX, cowY, heading: curCowAngle - Math.PI / 2,
          segments: [{ x1: barnPegP0.x, y1: barnPegP0.y, x2: cowX, y2: cowY }]
        };
      } else {
        const subF = (validT - 0.75) / 0.25;
        const subAngle = 0.5 * Math.PI - subF * (0.5 * Math.PI);
        const remRadius = (ropeRadiusM - BARN_H_M) * meterScale;
        const cowX = barnCornerC.x + Math.cos(subAngle) * remRadius;
        const cowY = barnCornerC.y + Math.sin(subAngle) * remRadius;
        return {
          cowX, cowY, heading: subAngle - Math.PI / 2,
          segments: [
            { x1: barnPegP0.x, y1: barnPegP0.y, x2: barnCornerC.x, y2: barnCornerC.y },
            { x1: barnCornerC.x, y1: barnCornerC.y, x2: cowX, y2: cowY }
          ]
        };
      }
    }

    function solveBarnTFromPoint(px, py, currentT) {
      const maxT = (barnDifficulty === 'basic' || ropeRadiusM <= BARN_H_M) ? 0.75 : 1.0;

      if (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M) {
        const dxC = px - barnCornerC.x;
        const dyC = py - barnCornerC.y;

        if (currentT >= 0.72 || (dxC >= -15 && dyC >= 0)) {
          if (dyC < 0 && dxC > 0) return 1.0;

          let angC = Math.atan2(dyC, dxC);
          if (angC < 0) angC = 0;
          if (angC > Math.PI / 2) angC = Math.PI / 2;

          const subF = (Math.PI / 2 - angC) / (Math.PI / 2);
          const candidateT = 0.75 + subF * 0.25;

          if (candidateT >= 0.75) return Math.min(1.0, candidateT);
        }
      }

      const dx = px - barnPegP0.x;
      const dy = py - barnPegP0.y;
      let theta = Math.atan2(dy, dx);

      let alpha = -theta;
      if (alpha < 0) alpha += Math.PI * 2;

      if (alpha > 1.5 * Math.PI) {
        if (currentT > 0.45) {
          return (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M) ? (currentT >= 0.75 ? 1.0 : 0.75) : 0.75;
        } else {
          return 0;
        }
      }

      const calculatedT = (alpha / (1.5 * Math.PI)) * 0.75;
      if (Math.abs(calculatedT - currentT) > 0.45) return currentT;

      return Math.max(0, Math.min(maxT, calculatedT));
    }

    function drawLittleSquirrel(x, y, heading) {
      ctx.save();
      ctx.translate(x, y);

      if (isSquirrelLoaded && squirrelImg.complete && squirrelImg.naturalWidth !== 0) {
        const size = 50;
        ctx.drawImage(squirrelImg, -size / 2, -size / 2, size, size);
      } else {
        ctx.rotate(heading);
        ctx.fillStyle = '#f59e0b';
        ctx.beginPath();
        ctx.arc(0, 0, 16, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = '#78350f';
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.fillStyle = '#b45309';
        ctx.beginPath();
        ctx.arc(-10, -14, 5, 0, Math.PI * 2);
        ctx.arc(10, -14, 5, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#0f172a';
        ctx.beginPath();
        ctx.arc(-5, -2, 2.5, 0, Math.PI * 2);
        ctx.arc(5, -2, 2.5, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.restore();
    }

    function handlePointerDown(px, py) {
      if (draggableSlices.length > 0) {
        for (let i = draggableSlices.length - 1; i >= 0; i--) {
          const slice = draggableSlices[i];
          const dist = Math.hypot(px - slice.x, py - slice.y);
          
          if (slice.id === 'barn_sub_slice') {
            if (dist <= slice.rPx + 35) {
              activeDragSlice = slice;
              dragSliceOffset.x = px - slice.x;
              dragSliceOffset.y = py - slice.y;
              return;
            }
          } else {
            if (dist <= slice.rPx + 20) {
              activeDragSlice = slice;
              dragSliceOffset.x = px - slice.x;
              dragSliceOffset.y = py - slice.y;
              return;
            }
          }
        }
      }

      if (currentMode === 'farm_inside') {
        const orderedMice = [...farmMice].sort((a, b) => (a.id === activeMouseId ? -1 : b.id === activeMouseId ? 1 : 0));

        for (const m of orderedMice) {
          if (Math.hypot(px - m.pegX, py - m.pegY) < 30) {
            activeMouseId = m.id;
            updateFarmUI();
            isDraggingPeg = true;
            render();
            return;
          }
        }

        for (const m of orderedMice) {
          const rPx = m.ropeRadiusM * meterScale;
          const cowX = m.pegX + Math.cos(m.cowAngle) * rPx;
          const cowY = m.pegY + Math.sin(m.cowAngle) * rPx;
          if (Math.hypot(px - cowX, py - cowY) < 55) {
            activeMouseId = m.id;
            updateFarmUI();
            isDraggingCow = true;
            m.prevCowAngle = m.cowAngle;
            render();
            return;
          }
        }
      } else {
        if (barnExploreStage === 'stretch') {
          const curCowX = barnPegP0.x + ropeRadiusM * meterScale;
          const curCowY = barnPegP0.y;
          if (Math.hypot(px - curCowX, py - curCowY) < 65 || Math.hypot(px - barnPegP0.x, py - barnPegP0.y) < 50) {
            isStretchingRope = true;
          }
        } else {
          const st = getBarnKinematics(cowParamT);
          if (Math.hypot(px - st.cowX, py - st.cowY) < 65) {
            isDraggingCow = true;
            barnCornerBlocked = false;
          }
        }
      }
    }

    function handlePointerMove(px, py) {
      if (activeDragSlice) {
        activeDragSlice.x = px - dragSliceOffset.x;
        activeDragSlice.y = py - dragSliceOffset.y;
        render();
        return;
      }

      if (isDraggingPeg && currentMode === 'farm_inside') {
        const m = getActiveMouse();
        if (!m) return;
        let nearestKey = m.slotKey;
        let minDist = Infinity;
        Object.entries(slots).forEach(([k, s]) => {
          const d = Math.hypot(px - s.x, py - s.y);
          if (d < minDist) {
            minDist = d;
            nearestKey = k;
          }
        });
        if (nearestKey !== m.slotKey) {
          applySlotToMouse(m, nearestKey, true, false);
        }
        render();
        return;
      }

      if (isStretchingRope) {
        const distPx = Math.max(0, px - barnPegP0.x);
        let m = Math.round(distPx / meterScale);
        const maxLimit = (barnDifficulty === 'basic') ? 8 : 10;
        m = Math.max(1, Math.min(maxLimit, m));

        ropeRadiusM = m;
        document.getElementById('ropeValueText').innerText = `${ropeRadiusM} m`;
        document.getElementById('statusRopeText2').innerText = `${ropeRadiusM} m`;
        document.getElementById('canvasHintText').innerHTML = `目前繩長：${ropeRadiusM}m。放開手指即可開始繞圈活動！`;
        render();
        return;
      }

      if (isDraggingCow) {
        if (currentMode === 'farm_inside') {
          const m = getActiveMouse();
          if (!m) return;
          const slot = slots[m.slotKey];
          const dx = px - m.pegX;
          const dy = py - m.pegY;
          let ang = Math.atan2(dy, dx);

          m.cowAngle = clampAngleForSlot(slot, ang);

          if (m.prevCowAngle !== null) {
            addSweepIntervalForMouse(m, m.prevCowAngle, m.cowAngle);
          }
          m.prevCowAngle = m.cowAngle;

          syncDraggableSlices();
          render();
        } else {
          if (barnCornerBlocked) return;

          const targetT = solveBarnTFromPoint(px, py, cowParamT);

          if (barnDifficulty === 'advanced' && ropeRadiusM > BARN_H_M && cowParamT < 0.745 && targetT >= 0.75) {
            cowParamT = 0.75;
            if (0.75 > barnMaxSweptT) barnMaxSweptT = 0.75;
            barnCornerBlocked = true;
            isDraggingCow = false;
            document.getElementById('canvasHintText').innerHTML = `⚠️ <b>小立鼠在角落卡住了！</b> 請放開手指重新按住小立鼠${MOUSE_ICON_HTML}繼續往下拖曳。`;
            syncDraggableSlices();
            render();
            return;
          }

          cowParamT = targetT;
          if (targetT > barnMaxSweptT) barnMaxSweptT = targetT;
          syncDraggableSlices();
          render();
        }
      }
    }

    function handlePointerUp() {
      if (isStretchingRope) {
        isStretchingRope = false;
        if (ropeRadiusM > 0) {
          barnExploreStage = 'walk';
          cowParamT = 0;
          barnMaxSweptT = 0;
          barnCornerBlocked = false;
          updateStepIndicator(2);
          document.getElementById('canvasHintText').innerHTML = `👉 步驟 2：按住小立鼠${MOUSE_ICON_HTML}順時針繞行活動！`;
        }
      }
      isDraggingCow = false;
      isDraggingPeg = false;
      activeDragSlice = null;
      farmMice.forEach(m => m.prevCowAngle = null);
      render();
    }

    function verifyBarnAnswer() {
      const val = parseFloat(document.getElementById('userAnswerBarn').value);
      if (isNaN(val)) {
        showModal('請輸入答案', '請先輸入您計算出的活動面積！', 'info');
        return;
      }

      if (barnDifficulty === 'basic' || ropeRadiusM <= BARN_H_M) {
        const r = ropeRadiusM;
        const mainA = r * r * 3.14 * 0.75;
        if (Math.abs(val - mainA) < 0.2) {
          let desc = `🎉 完全正確！\n\n【詳細計算步驟】\n司令台左上角活動範圍為 3/4 圓：\n${r} × ${r} × 3.14 × 3/4 = ${mainA.toFixed(2)} 平方公尺`;
          showModal('🎉 答對了！', desc, 'success');
        } else {
          showModal('算式提醒', `【解題提示】\n1. 繩長是 ${r}m\n2. 活動範圍為 3/4 圓：${r} × ${r} × 3.14 × 3/4 = ${mainA.toFixed(2)} 平方公尺`, 'error');
        }
      } else {
        const r = ropeRadiusM;
        const remR = r - BARN_H_M;
        const mainA = r * r * 3.14 * 0.75;
        const remA = remR * remR * 3.14 * 0.25;
        const totalA = mainA + remA;
        if (Math.abs(val - totalA) < 0.2) {
          let desc = `🎉 太厲害了！進階題完全正確！\n\n【詳細計算步驟】\n1. 主要綠色 3/4 圓 (半徑 ${r}m)：\n   ${r} × ${r} × 3.14 × 3/4 = ${mainA.toFixed(2)} 平方公尺\n2. 繞過角落折彎黃色 1/4 圓 (半徑 ${r} - 8 = ${remR}m)：\n   ${remR} × ${remR} × 3.14 × 1/4 = ${remA.toFixed(2)} 平方公尺\n總面積：${mainA.toFixed(2)} + ${remA.toFixed(2)} = ${totalA.toFixed(2)} 平方公尺`;
          showModal('🎉 答對了！', desc, 'success');
        } else {
          showModal('算式提醒', `【進階解題提示】\n1. 繩長 ${r}m，司令台寬 8m，轉角折彎後還剩 ${r} - 8 = ${remR}m！\n2. 主要綠色活動範圍 (3/4 圓)：${r} × ${r} × 3.14 × 3/4 = ${mainA.toFixed(2)}\n3. 角落折彎黃色活動範圍 (1/4 圓)：${remR} × ${remR} × 3.14 × 1/4 = ${remA.toFixed(2)}\n兩者相加即為答案！`, 'error');
        }
      }
    }

    function setModalIcon(type) {
      const icon = document.getElementById('modalIcon');
      if (type === 'success') {
        icon.className = 'w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl mb-3 bg-emerald-500/20 text-emerald-400';
        icon.innerHTML = '<i class="fa-solid fa-check"></i>';
      } else {
        icon.className = 'w-12 h-12 mx-auto rounded-full flex items-center justify-center text-xl mb-3 bg-amber-500/20 text-amber-400';
        icon.innerHTML = '<i class="fa-solid fa-lightbulb"></i>';
      }
    }

    function showModal(title, desc, type) {
      document.getElementById('modalTitle').innerText = title;
      const bodyEl = document.getElementById('modalBody');
      bodyEl.className = 'text-xs md:text-sm text-slate-300 mb-5 leading-relaxed whitespace-pre-line text-left bg-slate-900/70 p-3.5 rounded-xl border border-slate-800';
      bodyEl.innerText = desc;
      setModalIcon(type);
      document.getElementById('modalBackdrop').classList.remove('hidden');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.add('hidden');
    }

    canvas.addEventListener('mousedown', e => {
      const r = canvas.getBoundingClientRect();
      handlePointerDown(e.clientX - r.left, e.clientY - r.top);
    });
    window.addEventListener('mousemove', e => {
      const r = canvas.getBoundingClientRect();
      handlePointerMove(e.clientX - r.left, e.clientY - r.top);
    });
    window.addEventListener('mouseup', handlePointerUp);

    canvas.addEventListener('touchstart', e => {
      if (e.touches.length === 1) {
        const r = canvas.getBoundingClientRect();
        handlePointerDown(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchmove', e => {
      if ((isDraggingCow || isDraggingPeg || isStretchingRope || activeDragSlice) && e.touches.length === 1) {
        const r = canvas.getBoundingClientRect();
        handlePointerMove(e.touches[0].clientX - r.left, e.touches[0].clientY - r.top);
        e.preventDefault();
      }
    }, { passive: false });

    window.addEventListener('touchend', handlePointerUp);
    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        resizeCanvas();
        initDefaultFarmMice();
        applySlotToMouse(getActiveMouse(), 'center', true, true);
        render();
      }, 50);
    });
  </script>
</body>
</html>
