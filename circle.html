<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <!-- 鎖定視窗縮放，專門針對平板觸控最佳化 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>圓面積探索</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1a2a47; /* 純素色深藍 */
    }

    #app-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1024px;
      height: 700px;
      transform-origin: center center;
      box-sizing: border-box;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* 數字輸入框隱藏原生微調箭頭，保持介面清爽 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="flex items-center justify-center">

  <div id="app-wrapper" class="flex flex-col justify-between p-6">

    <!-- 頂部導覽與頁籤切換區 -->
    <header class="flex items-center justify-between glass-panel px-6 py-3 rounded-2xl">
      <!-- 回首頁 -->
      <a href="index.html" class="flex items-center gap-2 text-sky-200 hover:text-white font-bold text-base bg-white/10 px-4 py-2 rounded-xl border border-white/20 active:scale-95 transition-all">
        <span>⌂ 回首頁</span>
      </a>

      <!-- 模式切換頁籤 -->
      <div class="flex items-center bg-black/30 p-1.5 rounded-xl border border-white/15">
        <button id="tab-grid" class="px-6 py-2 rounded-lg font-black text-base tracking-wide bg-amber-500 text-slate-950 shadow-md transition-all">
          數格子估算
        </button>
        <button id="tab-split" onclick="alert('圓面積的推算即將在下一步加入！')" class="px-6 py-2 rounded-lg font-bold text-base tracking-wide text-sky-200 hover:text-white transition-all">
          圓面積的推算
        </button>
      </div>

      <!-- 右側留白佔位，讓中央頁籤維持視覺水平置中 -->
      <div class="w-[110px]"></div>
    </header>

    <!-- 主體內容區（左：方格畫布，右：控制與自主計算面板） -->
    <main class="grid grid-cols-12 gap-6 my-auto h-[575px] w-full items-center">

      <!-- 左側畫布區（佔 7 格） -->
      <div class="col-span-7 h-full glass-panel rounded-3xl p-4 flex flex-col justify-between items-center relative">
        <div class="w-full flex justify-between items-center text-sm text-sky-200 font-medium px-2">
          <span>提示：每格為 1 cm × 1 cm</span>
          <span id="canvas-hint" class="text-amber-300 font-bold">請先點選右側要數的方格類型</span>
        </div>

        <!-- 互動 Canvas 畫布 -->
        <div class="relative flex items-center justify-center flex-1 my-1">
          <canvas id="gridCanvas" width="440" height="440" class="rounded-2xl shadow-lg cursor-pointer bg-white"></canvas>
        </div>

        <!-- 畫布底部工具列 -->
        <div class="w-full flex justify-between items-center px-2">
          <button id="btn-random-circle" class="flex items-center gap-1.5 text-sm bg-indigo-500/80 hover:bg-indigo-500 text-white font-bold px-4 py-2.5 rounded-xl shadow border border-indigo-400/40 active:scale-95 transition-all">
            <span>🎲 隨機產生不同的圓</span>
          </button>

          <button id="btn-clear-count" class="text-sm bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-4 py-2 rounded-xl border border-rose-400/30 active:scale-95 transition-all">
            重數當前題目
          </button>
        </div>
      </div>

      <!-- 右側控制與自主答題面板（佔 5 格，加大卡片上下間距至 gap-5） -->
      <div class="col-span-5 h-full flex flex-col justify-between gap-5">

        <!-- 卡片 1：步驟 1 點選數數模式切換（加大內距與文字） -->
        <div class="glass-panel p-5 rounded-3xl text-white">
          <h2 class="text-lg font-black text-amber-400 mb-3 flex items-center gap-2">
            <span>步驟 1</span> 選擇方格進行點數
          </h2>

          <div class="grid grid-cols-2 gap-3">
            <!-- 數完整方格 -->
            <label id="label-mode-full" class="flex flex-col p-3.5 rounded-2xl bg-amber-500/20 border-2 border-amber-400 cursor-pointer transition-all">
              <div class="flex items-center justify-between">
                <span class="w-5 h-5 rounded-md bg-amber-400 inline-block"></span>
                <input type="radio" name="countMode" value="full" checked class="w-5 h-5 accent-amber-500">
              </div>
              <span class="font-bold text-base text-amber-200 mt-2">完整方格</span>
              <span id="label-full-current" class="text-sm text-slate-300 mt-0.5">已數：0 格</span>
            </label>

            <!-- 數不完整方格 -->
            <label id="label-mode-partial" class="flex flex-col p-3.5 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all">
              <div class="flex items-center justify-between">
                <span class="w-5 h-5 rounded-md bg-orange-400 inline-block"></span>
                <input type="radio" name="countMode" value="partial" class="w-5 h-5 accent-orange-500">
              </div>
              <span class="font-bold text-base text-slate-200 mt-2">不完整方格</span>
              <span id="label-partial-current" class="text-sm text-slate-300 mt-0.5">已數：0 格</span>
            </label>
          </div>
        </div>

        <!-- 卡片 2：步驟 2 學生自己動手計算算式（加大上下間距與各級文字） -->
        <div class="glass-panel p-5 rounded-3xl text-white flex-1 flex flex-col justify-between">
          <div class="space-y-4">
            <h2 class="text-lg font-black text-amber-400 flex items-center gap-2">
              <span>步驟 2</span> 填入格數並自己動手算
            </h2>

            <!-- 格數輸入欄位（加大文字與內距） -->
            <div class="grid grid-cols-2 gap-3">
              <div class="bg-black/20 p-3 rounded-2xl border border-white/10">
                <label class="text-xs text-amber-300 font-bold block mb-1">完整方格數 (A)</label>
                <input type="number" id="input-full" placeholder="格數" class="w-full bg-white/10 border border-white/20 rounded-xl px-2 py-1.5 text-center font-mono font-black text-lg text-white focus:outline-none focus:border-amber-400">
              </div>
              <div class="bg-black/20 p-3 rounded-2xl border border-white/10">
                <label class="text-xs text-orange-300 font-bold block mb-1">不完整方格數 (B)</label>
                <input type="number" id="input-partial" placeholder="格數" class="w-full bg-white/10 border border-white/20 rounded-xl px-2 py-1.5 text-center font-mono font-black text-lg text-white focus:outline-none focus:border-orange-400">
              </div>
            </div>

            <!-- 學生動手做除法與加法算式區塊（整體文字加大並拉開間距） -->
            <div class="bg-black/30 p-4 rounded-2xl border border-white/10 space-y-3">
              <div class="text-xs text-amber-200 font-semibold flex items-center justify-between border-b border-white/10 pb-2">
                <span>計算過程 (不完整 2 格折 1 格)：</span>
              </div>

              <!-- 第一步：不完整方格除法計算 (B ÷ 2) -->
              <div class="flex items-center gap-2 text-base font-mono text-slate-200 flex-wrap">
                <span class="text-slate-300 font-bold text-sm">不完整方格：</span>
                <span id="disp-b-val" class="text-orange-300 font-black text-lg">B</span>
                <span class="font-bold">÷ 2 =</span>
                <input type="number" step="any" id="input-half" placeholder="自行計算" class="w-24 bg-white/15 border border-white/30 rounded-xl px-2 py-1 text-center font-bold text-sky-300 focus:outline-none focus:border-sky-400 text-base">
                <span class="text-sm">格</span>
              </div>

              <!-- 第二步：加法計算 (A + 不完整格折半) = 最終估算面積 -->
              <div class="flex items-center gap-2 text-base font-mono text-slate-200 flex-wrap pt-2.5 border-t border-white/5">
                <span class="text-slate-300 font-bold text-sm">總計：</span>
                <span id="disp-a-val" class="text-amber-300 font-black text-lg">A</span>
                <span class="font-bold">+</span>
                <span id="disp-half-preview" class="text-sky-300 font-bold">(折半)</span>
                <span class="font-bold">=</span>
                <input type="number" step="any" id="input-final-area" placeholder="最終面積" class="w-28 bg-white/20 border-2 border-emerald-400/80 rounded-xl px-2 py-1 text-center font-black text-emerald-300 text-lg focus:outline-none focus:border-emerald-300">
                <span class="text-emerald-300 font-black text-sm">cm²</span>
              </div>
            </div>
          </div>

          <!-- 核對結果回饋與按鈕（加大按鈕厚度與字體） -->
          <div class="pt-3">
            <div id="feedback-box" class="hidden text-center text-sm font-bold py-2 px-3 rounded-xl mb-2.5"></div>
            
            <button id="btn-check-ans" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-3 rounded-xl shadow-lg border border-emerald-300/40 active:scale-95 transition-all text-base tracking-wider">
              送出核對答案 ➜
            </button>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- 核心互動邏輯腳本 -->
  <script>
    // 平板視窗縮放適配
    function autoScale() {
      const wrapper = document.getElementById('app-wrapper');
      const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 700) * 0.96;
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', autoScale);
    window.addEventListener('orientationchange', autoScale);
    window.addEventListener('DOMContentLoaded', autoScale);
    document.addEventListener('gesturestart', e => e.preventDefault());

    // 畫布參數
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 10;
    const cellSize = canvas.width / gridSize;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    // 當前圓半徑（格數）
    let currentRadiusCells = 4.0;

    // 學生點選計數紀錄陣列
    let fullMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    let partialMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    let fullCounter = 0;
    let partialCounter = 0;

    // 方格幾何相交判定 (1: 內, 2: 邊, 0: 外)
    function getCellType(col, row, rCells) {
      const rPx = rCells * cellSize;
      const corners = [
        { x: col * cellSize, y: row * cellSize },
        { x: (col + 1) * cellSize, y: row * cellSize },
        { x: col * cellSize, y: (row + 1) * cellSize },
        { x: (col + 1) * cellSize, y: (row + 1) * cellSize }
      ];

      const insideCount = corners.filter(pt => {
        const dx = pt.x - centerX;
        const dy = pt.y - centerY;
        return (dx * dx + dy * dy) <= (rPx * rPx);
      }).length;

      if (insideCount === 4) return 1;
      if (insideCount > 0 && insideCount < 4) return 2;

      const cx = (col + 0.5) * cellSize;
      const cy = (row + 0.5) * cellSize;
      const distSq = (cx - centerX)**2 + (cy - centerY)**2;
      if (distSq < (rPx + cellSize*0.7)**2 && distSq > (rPx - cellSize*0.7)**2) {
        return 2;
      }
      return 0;
    }

    // 計算系統正確數量
    function getSystemCounts() {
      let sysFull = 0, sysPartial = 0;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const type = getCellType(c, r, currentRadiusCells);
          if (type === 1) sysFull++;
          else if (type === 2) sysPartial++;
        }
      }
      return { sysFull, sysPartial };
    }

    // 繪製畫布
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 底層顏色
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const type = getCellType(c, r, currentRadiusCells);
          if (type === 1) {
            ctx.fillStyle = '#fef08a'; // 完整格黃色
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          } else if (type === 2) {
            ctx.fillStyle = '#fed7aa'; // 不完整格橘色
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }

      // 2. 網格線條
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }

      // 3. 圓形輪廓
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentRadiusCells * cellSize, 0, Math.PI * 2);
      ctx.strokeStyle = '#ea580c';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // 圓心
      ctx.beginPath();
      ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // 4. 繪製邊點邊數數字
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const fx = (c + 0.5) * cellSize;
          const fy = (r + 0.5) * cellSize;

          if (fullMarks[r][c] > 0) {
            ctx.beginPath();
            ctx.arc(fx, fy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#1e3a8a';
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(fullMarks[r][c], fx, fy + 1);
          } else if (partialMarks[r][c] > 0) {
            ctx.beginPath();
            ctx.arc(fx, fy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#c2410c';
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(partialMarks[r][c], fx, fy + 1);
          }
        }
      }

      // 更新側邊計數文字
      document.getElementById('label-full-current').textContent = `已數：${fullCounter} 格`;
      document.getElementById('label-partial-current').textContent = `已數：${partialCounter} 格`;
    }

    // 重新排序序號
    function resequenceMarks() {
      let fNum = 1;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (fullMarks[r][c] > 0) fullMarks[r][c] = fNum++;
        }
      }
      fullCounter = fNum - 1;

      let pNum = 1;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (partialMarks[r][c] > 0) partialMarks[r][c] = pNum++;
        }
      }
      partialCounter = pNum - 1;
    }

    // 畫布點擊互動
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      const col = Math.floor(x / cellSize);
      const row = Math.floor(y / cellSize);

      if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return;

      const currentMode = document.querySelector('input[name="countMode"]:checked').value;
      const cellType = getCellType(col, row, currentRadiusCells);

      if (currentMode === 'full') {
        if (cellType !== 1) return;
        if (fullMarks[row][col] > 0) {
          fullMarks[row][col] = 0;
          resequenceMarks();
        } else {
          fullCounter++;
          fullMarks[row][col] = fullCounter;
        }
      } else if (currentMode === 'partial') {
        if (cellType !== 2) return;
        if (partialMarks[row][col] > 0) {
          partialMarks[row][col] = 0;
          resequenceMarks();
        } else {
          partialCounter++;
          partialMarks[row][col] = partialCounter;
        }
      }

      draw();
    });

    // 模式切換樣式
    document.querySelectorAll('input[name="countMode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const isFull = e.target.value === 'full';
        const labelFull = document.getElementById('label-mode-full');
        const labelPartial = document.getElementById('label-mode-partial');
        const hint = document.getElementById('canvas-hint');

        if (isFull) {
          labelFull.className = "flex flex-col p-3.5 rounded-2xl bg-amber-500/20 border-2 border-amber-400 cursor-pointer transition-all";
          labelPartial.className = "flex flex-col p-3.5 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all";
          hint.textContent = "目前模式：點擊【黃色完整方格】計數";
          hint.className = "text-amber-300 font-bold";
        } else {
          labelFull.className = "flex flex-col p-3.5 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all";
          labelPartial.className = "flex flex-col p-3.5 rounded-2xl bg-orange-500/20 border-2 border-orange-400 cursor-pointer transition-all";
          hint.textContent = "目前模式：點擊【橘色不完整方格】計數";
          hint.className = "text-orange-300 font-bold";
        }
      });
    });

    // 隨機產生圓形
    function generateRandomCircle() {
      const possibleRadii = [3.0, 3.2, 3.5, 3.8, 4.0, 4.2, 4.5];
      let newR;
      do {
        newR = possibleRadii[Math.floor(Math.random() * possibleRadii.length)];
      } while (newR === currentRadiusCells && possibleRadii.length > 1);

      currentRadiusCells = newR;
      resetCurrentCounters();
      
      // 清空輸入框
      document.getElementById('input-full').value = '';
      document.getElementById('input-partial').value = '';
      document.getElementById('input-half').value = '';
      document.getElementById('input-final-area').value = '';
      document.getElementById('feedback-box').className = 'hidden';
      syncInputsToEquation();
      draw();
    }

    // 重設計數
    function resetCurrentCounters() {
      fullMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      partialMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      fullCounter = 0;
      partialCounter = 0;
      draw();
    }

    document.getElementById('btn-random-circle').addEventListener('click', generateRandomCircle);
    document.getElementById('btn-clear-count').addEventListener('click', () => {
      resetCurrentCounters();
      document.getElementById('feedback-box').className = 'hidden';
    });

    // 將輸入值動態帶入下方的算式提示文字中
    function syncInputsToEquation() {
      const a = document.getElementById('input-full').value.trim();
      const b = document.getElementById('input-partial').value.trim();
      const half = document.getElementById('input-half').value.trim();

      document.getElementById('disp-a-val').textContent = a !== '' ? a : 'A';
      document.getElementById('disp-b-val').textContent = b !== '' ? b : 'B';
      document.getElementById('disp-half-preview').textContent = half !== '' ? half : '(折半)';
    }

    document.getElementById('input-full').addEventListener('input', syncInputsToEquation);
    document.getElementById('input-partial').addEventListener('input', syncInputsToEquation);
    document.getElementById('input-half').addEventListener('input', syncInputsToEquation);

    // 核對答案（分步檢查格數、除法與加法結果）
    document.getElementById('btn-check-ans').addEventListener('click', () => {
      const valA = document.getElementById('input-full').value.trim();
      const valB = document.getElementById('input-partial').value.trim();
      const valHalf = document.getElementById('input-half').value.trim();
      const valFinal = document.getElementById('input-final-area').value.trim();
      const fb = document.getElementById('feedback-box');

      // 1. 檢查是否漏填
      if (valA === '' || valB === '' || valHalf === '' || valFinal === '') {
        fb.className = "text-center text-sm font-bold py-2.5 px-3 rounded-xl mb-2.5 bg-amber-500/20 text-amber-300 border border-amber-400/40 block";
        fb.textContent = "每個空格都要填寫喔！請填寫格數、折半計算與最終面積！";
        return;
      }

      const numA = parseFloat(valA);
      const numB = parseFloat(valB);
      const numHalf = parseFloat(valHalf);
      const numFinal = parseFloat(valFinal);

      const { sysFull, sysPartial } = getSystemCounts();

      // 2. 逐步判定錯誤環節
      let errors = [];

      if (numA !== sysFull) {
        errors.push(`完整方格數算錯了（應為 ${sysFull} 格）`);
      }
      if (numB !== sysPartial) {
        errors.push(`不完整方格數算錯了（應為 ${sysPartial} 格）`);
      }
      if (numHalf !== (numB / 2)) {
        errors.push(`不完整方格除以 2 算錯了（${numB} ÷ 2 應該是 ${numB / 2}）`);
      }
      if (numFinal !== (numA + numHalf)) {
        errors.push(`最後的加法總和算錯了（${numA} + ${numHalf} 應該是 ${numA + numHalf}）`);
      }

      // 3. 顯示回饋
      if (errors.length === 0) {
        fb.className = "text-center text-sm font-bold py-2.5 px-3 rounded-xl mb-2.5 bg-emerald-500/30 text-emerald-200 border border-emerald-400/50 block";
        fb.innerHTML = `🎉 太厲害了！完全正確！<br>格數與計算步驟全都答對了，估算圓面積為 <strong>${numFinal} cm²</strong>！`;
      } else {
        fb.className = "text-center text-sm font-bold py-2.5 px-3 rounded-xl mb-2.5 bg-rose-500/25 text-rose-200 border border-rose-400/50 block text-left";
        fb.innerHTML = `⚠️ 有些步驟需要再檢查一下喔：<br><ul class="list-disc list-inside mt-1 space-y-0.5">${errors.map(err => `<li>${err}</li>`).join('')}</ul>`;
      }
    });

    // 初始繪製
    draw();
  </script>
</body>
</html>
