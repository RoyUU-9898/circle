<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>圓面積探索 - 柚子老師教學天地</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1a2a47; /* 純素色深藍 */
    }

    #app-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1024px;
      height: 700px;
      transform-origin: center center;
      box-sizing: border-box;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    /* 數字輸入框隱藏原生箭頭 */
    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="flex items-center justify-center">

  <div id="app-wrapper" class="flex flex-col justify-between p-6">

    <!-- 頂部導覽與頁籤切換區 -->
    <header class="flex items-center justify-between glass-panel px-6 py-3 rounded-2xl">
      <!-- 回首頁 -->
      <a href="index.html" class="flex items-center gap-2 text-sky-200 hover:text-white font-bold text-sm bg-white/10 px-4 py-2 rounded-xl border border-white/20 active:scale-95 transition-all">
        <span>⌂ 回首頁</span>
      </a>

      <!-- 模式切換頁籤 -->
      <div class="flex items-center bg-black/30 p-1.5 rounded-xl border border-white/15">
        <button id="tab-grid" class="px-6 py-2 rounded-lg font-black text-sm tracking-wide bg-amber-500 text-slate-950 shadow-md transition-all">
          數格子估算
        </button>
        <button id="tab-split" onclick="alert('圓面積的推算即將在下一步加入！')" class="px-6 py-2 rounded-lg font-bold text-sm tracking-wide text-sky-200 hover:text-white transition-all">
          圓面積的推算
        </button>
      </div>

      <!-- 署名 -->
      <div class="flex items-center gap-2 text-sky-100 text-sm font-bold bg-white/10 px-4 py-2 rounded-xl border border-white/15">
        <img src="teacher.png" alt="柚子" class="w-5 h-5 object-contain" onerror="this.style.display='none'">
        <span>柚子老師製作</span>
      </div>
    </header>

    <!-- 主體內容區（左：方格畫布，右：控制與答題面板） -->
    <main class="grid grid-cols-12 gap-6 my-auto h-[575px] w-full items-center">

      <!-- 左側畫布區（佔 7 格） -->
      <div class="col-span-7 h-full glass-panel rounded-3xl p-4 flex flex-col justify-between items-center relative">
        <div class="w-full flex justify-between items-center text-xs text-sky-200 font-medium px-2">
          <span>提示：每格為 1 cm × 1 cm</span>
          <span id="canvas-hint" class="text-amber-300 font-bold">請先勾選右側要數的方格類型</span>
        </div>

        <!-- 互動 Canvas 畫布 -->
        <div class="relative flex items-center justify-center flex-1 my-1">
          <canvas id="gridCanvas" width="440" height="440" class="rounded-2xl shadow-lg cursor-pointer bg-white"></canvas>
        </div>

        <!-- 畫布底部工具列：隨機出題與重設 -->
        <div class="w-full flex justify-between items-center px-2">
          <button id="btn-random-circle" class="flex items-center gap-1.5 text-xs bg-indigo-500/80 hover:bg-indigo-500 text-white font-bold px-4 py-2 rounded-xl shadow border border-indigo-400/40 active:scale-95 transition-all">
            <span>🎲 隨機產生不同的圓</span>
          </button>

          <button id="btn-clear-count" class="text-xs bg-rose-500/20 text-rose-300 hover:bg-rose-500/30 px-3 py-2 rounded-xl border border-rose-400/30 active:scale-95 transition-all">
            重數當前題目
          </button>
        </div>
      </div>

      <!-- 右側控制與答題面板（佔 5 格） -->
      <div class="col-span-5 h-full flex flex-col justify-between gap-3">

        <!-- 卡片 1：點選數數模式切換 -->
        <div class="glass-panel p-4 rounded-3xl text-white">
          <h2 class="text-base font-black text-amber-400 mb-2 flex items-center gap-2">
            <span>步驟 1</span> 選擇現在要數的方格（單選）
          </h2>

          <div class="grid grid-cols-2 gap-2">
            <!-- 模式：數完整方格 -->
            <label id="label-mode-full" class="flex flex-col p-3 rounded-2xl bg-amber-500/20 border-2 border-amber-400 cursor-pointer transition-all">
              <div class="flex items-center justify-between">
                <span class="w-4 h-4 rounded-md bg-amber-400 inline-block"></span>
                <input type="radio" name="countMode" value="full" checked class="w-4 h-4 accent-amber-500">
              </div>
              <span class="font-bold text-sm text-amber-200 mt-1">完整方格</span>
              <span id="label-full-current" class="text-xs text-slate-300 mt-0.5">已數：0 格</span>
            </label>

            <!-- 模式：數不完整方格 -->
            <label id="label-mode-partial" class="flex flex-col p-3 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all">
              <div class="flex items-center justify-between">
                <span class="w-4 h-4 rounded-md bg-orange-400 inline-block"></span>
                <input type="radio" name="countMode" value="partial" class="w-4 h-4 accent-orange-500">
              </div>
              <span class="font-bold text-sm text-slate-200 mt-1">不完整方格</span>
              <span id="label-partial-current" class="text-xs text-slate-300 mt-0.5">已數：0 格</span>
            </label>
          </div>
        </div>

        <!-- 卡片 2：輸入答案與核對 -->
        <div class="glass-panel p-4 rounded-3xl text-white flex-1 flex flex-col justify-between">
          <div>
            <h2 class="text-base font-black text-amber-400 mb-2 flex items-center gap-2">
              <span>步驟 2</span> 輸入方格數並計算面積
            </h2>

            <div class="bg-amber-400/10 border border-amber-400/30 p-2.5 rounded-xl mb-3 text-xs text-amber-200 leading-relaxed">
              💡 <strong>估算原則：</strong>每 <strong>2 個不完整方格</strong> 估算為 <strong>1 格</strong>。
            </div>

            <!-- 輸入區 -->
            <div class="grid grid-cols-2 gap-3 mb-3">
              <div class="bg-black/20 p-2.5 rounded-xl border border-white/10">
                <label class="text-xs text-amber-300 font-bold block mb-1">完整方格數 (A)</label>
                <input type="number" id="input-full" placeholder="輸入格數" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-1.5 text-center font-mono font-bold text-lg text-white focus:outline-none focus:border-amber-400">
              </div>
              <div class="bg-black/20 p-2.5 rounded-xl border border-white/10">
                <label class="text-xs text-orange-300 font-bold block mb-1">不完整方格數 (B)</label>
                <input type="number" id="input-partial" placeholder="輸入格數" class="w-full bg-white/10 border border-white/20 rounded-lg px-3 py-1.5 text-center font-mono font-bold text-lg text-white focus:outline-none focus:border-orange-400">
              </div>
            </div>

            <!-- 即時算式預覽 -->
            <div class="bg-black/30 px-3 py-2 rounded-xl border border-white/10 text-xs font-mono flex justify-between items-center text-slate-300">
              <span>算式預覽：</span>
              <span id="preview-calc" class="text-sky-300 font-bold">_ + (_ ÷ 2) = _ cm²</span>
            </div>
          </div>

          <!-- 核對結果回饋與送出按鈕 -->
          <div class="pt-2">
            <div id="feedback-box" class="hidden text-center text-xs font-bold py-1.5 px-3 rounded-xl mb-2"></div>
            
            <button id="btn-check-ans" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2.5 rounded-xl shadow-lg border border-emerald-300/40 active:scale-95 transition-all text-sm tracking-wider">
              送出核對答案 ➜
            </button>
          </div>
        </div>

      </div>

    </main>

  </div>

  <!-- 核心互動邏輯腳本 -->
  <script>
    // 平板適配
    function autoScale() {
      const wrapper = document.getElementById('app-wrapper');
      const scale = Math.min(window.innerWidth / 1024, window.innerHeight / 700) * 0.96;
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }
    window.addEventListener('resize', autoScale);
    window.addEventListener('orientationchange', autoScale);
    window.addEventListener('DOMContentLoaded', autoScale);
    document.addEventListener('gesturestart', e => e.preventDefault());

    // 畫布基礎參數
    const canvas = document.getElementById('gridCanvas');
    const ctx = canvas.getContext('2d');
    const gridSize = 10;
    const cellSize = canvas.width / gridSize;
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;

    // 當前圓的半徑（單位：格數）
    let currentRadiusCells = 4.0; // 預設直徑 8 格 (半徑 4 格)

    // 儲存學生點擊的序號地圖：0 代表沒點，>0 代表點擊序號
    let fullMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
    let partialMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));

    let fullCounter = 0;
    let partialCounter = 0;

    // 判定方格類型：1=完整在圓內, 2=相交不完整, 0=圓外
    function getCellType(col, row, rCells) {
      const rPx = rCells * cellSize;
      const corners = [
        { x: col * cellSize, y: row * cellSize },
        { x: (col + 1) * cellSize, y: row * cellSize },
        { x: col * cellSize, y: (row + 1) * cellSize },
        { x: (col + 1) * cellSize, y: (row + 1) * cellSize }
      ];

      const insideCount = corners.filter(pt => {
        const dx = pt.x - centerX;
        const dy = pt.y - centerY;
        return (dx * dx + dy * dy) <= (rPx * rPx);
      }).length;

      if (insideCount === 4) return 1;
      if (insideCount > 0 && insideCount < 4) return 2;

      // 邊緣凸出檢測
      const cx = (col + 0.5) * cellSize;
      const cy = (row + 0.5) * cellSize;
      const distSq = (cx - centerX)**2 + (cy - centerY)**2;
      if (distSq < (rPx + cellSize*0.7)**2 && distSq > (rPx - cellSize*0.7)**2) {
        return 2;
      }
      return 0;
    }

    // 計算系統標準答案
    function getSystemCounts() {
      let sysFull = 0, sysPartial = 0;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const type = getCellType(c, r, currentRadiusCells);
          if (type === 1) sysFull++;
          else if (type === 2) sysPartial++;
        }
      }
      return { sysFull, sysPartial };
    }

    // 重繪畫布
    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // 1. 底層方格填色
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const type = getCellType(c, r, currentRadiusCells);
          if (type === 1) {
            ctx.fillStyle = '#fef08a'; // 完整格：柔和亮黃
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          } else if (type === 2) {
            ctx.fillStyle = '#fed7aa'; // 不完整格：淡橘色
            ctx.fillRect(c * cellSize, r * cellSize, cellSize, cellSize);
          }
        }
      }

      // 2. 網格線
      ctx.strokeStyle = '#cbd5e1';
      ctx.lineWidth = 1;
      for (let i = 0; i <= gridSize; i++) {
        ctx.beginPath();
        ctx.moveTo(i * cellSize, 0);
        ctx.lineTo(i * cellSize, canvas.height);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(0, i * cellSize);
        ctx.lineTo(canvas.width, i * cellSize);
        ctx.stroke();
      }

      // 3. 圓形輪廓
      ctx.beginPath();
      ctx.arc(centerX, centerY, currentRadiusCells * cellSize, 0, Math.PI * 2);
      ctx.strokeStyle = '#ea580c';
      ctx.lineWidth = 3.5;
      ctx.stroke();

      // 圓心點
      ctx.beginPath();
      ctx.arc(centerX, centerY, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#0f172a';
      ctx.fill();

      // 4. 繪製點擊數字標記（邊點邊跳 1, 2, 3...）
      ctx.font = 'bold 15px monospace';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';

      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          const fx = (c + 0.5) * cellSize;
          const fy = (r + 0.5) * cellSize;

          if (fullMarks[r][c] > 0) {
            // 完整格數字：深藍色圓底 + 白字
            ctx.beginPath();
            ctx.arc(fx, fy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#1e3a8a';
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(fullMarks[r][c], fx, fy + 1);
          } else if (partialMarks[r][c] > 0) {
            // 不完整格數字：深橘紅圓底 + 白字
            ctx.beginPath();
            ctx.arc(fx, fy, 12, 0, Math.PI * 2);
            ctx.fillStyle = '#c2410c';
            ctx.fill();
            ctx.fillStyle = '#ffffff';
            ctx.fillText(partialMarks[r][c], fx, fy + 1);
          }
        }
      }

      // 更新側邊累計顯示
      document.getElementById('label-full-current').textContent = `已數：${fullCounter} 格`;
      document.getElementById('label-partial-current').textContent = `已數：${partialCounter} 格`;
    }

    // 重新編號（當學生點擊已標記的格子取消時，重新整理剩餘格子的序號 1~N）
    function resequenceMarks() {
      // 重新整理 fullMarks
      let fNum = 1;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (fullMarks[r][c] > 0) fullMarks[r][c] = fNum++;
        }
      }
      fullCounter = fNum - 1;

      // 重新整理 partialMarks
      let pNum = 1;
      for (let r = 0; r < gridSize; r++) {
        for (let c = 0; c < gridSize; c++) {
          if (partialMarks[r][c] > 0) partialMarks[r][c] = pNum++;
        }
      }
      partialCounter = pNum - 1;
    }

    // 畫布點擊事件
    canvas.addEventListener('pointerdown', (e) => {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const x = (e.clientX - rect.left) * scaleX;
      const y = (e.clientY - rect.top) * scaleY;

      const col = Math.floor(x / cellSize);
      const row = Math.floor(y / cellSize);

      if (col < 0 || col >= gridSize || row < 0 || row >= gridSize) return;

      const currentMode = document.querySelector('input[name="countMode"]:checked').value;
      const cellType = getCellType(col, row, currentRadiusCells);

      if (currentMode === 'full') {
        if (cellType !== 1) {
          // 點到非完整格提示
          return;
        }
        if (fullMarks[row][col] > 0) {
          fullMarks[row][col] = 0; // 取消標記
          resequenceMarks();
        } else {
          fullCounter++;
          fullMarks[row][col] = fullCounter;
        }
      } else if (currentMode === 'partial') {
        if (cellType !== 2) {
          // 點到非不完整格提示
          return;
        }
        if (partialMarks[row][col] > 0) {
          partialMarks[row][col] = 0; // 取消標記
          resequenceMarks();
        } else {
          partialCounter++;
          partialMarks[row][col] = partialCounter;
        }
      }

      draw();
    });

    // 監聽模式切換按鈕高亮
    document.querySelectorAll('input[name="countMode"]').forEach(radio => {
      radio.addEventListener('change', (e) => {
        const isFull = e.target.value === 'full';
        const labelFull = document.getElementById('label-mode-full');
        const labelPartial = document.getElementById('label-mode-partial');
        const hint = document.getElementById('canvas-hint');

        if (isFull) {
          labelFull.className = "flex flex-col p-3 rounded-2xl bg-amber-500/20 border-2 border-amber-400 cursor-pointer transition-all";
          labelPartial.className = "flex flex-col p-3 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all";
          hint.textContent = "目前模式：點擊【黃色完整方格】計數";
          hint.className = "text-amber-300 font-bold";
        } else {
          labelFull.className = "flex flex-col p-3 rounded-2xl bg-white/5 border border-white/10 cursor-pointer hover:bg-white/10 transition-all";
          labelPartial.className = "flex flex-col p-3 rounded-2xl bg-orange-500/20 border-2 border-orange-400 cursor-pointer transition-all";
          hint.textContent = "目前模式：點擊【橘色不完整方格】計數";
          hint.className = "text-orange-300 font-bold";
        }
      });
    });

    // 隨機產生圓形
    function generateRandomCircle() {
      // 隨機半徑：從 3.0 到 4.6 格（步長 0.2 或 0.5）
      const possibleRadii = [3.0, 3.2, 3.5, 3.8, 4.0, 4.2, 4.5];
      let newR;
      do {
        newR = possibleRadii[Math.floor(Math.random() * possibleRadii.length)];
      } while (newR === currentRadiusCells && possibleRadii.length > 1);

      currentRadiusCells = newR;
      resetCurrentCounters();
      document.getElementById('feedback-box').className = 'hidden';
      document.getElementById('input-full').value = '';
      document.getElementById('input-partial').value = '';
      updateFormulaPreview();
      draw();
    }

    // 重設計數數據
    function resetCurrentCounters() {
      fullMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      partialMarks = Array(gridSize).fill().map(() => Array(gridSize).fill(0));
      fullCounter = 0;
      partialCounter = 0;
      draw();
    }

    document.getElementById('btn-random-circle').addEventListener('click', generateRandomCircle);
    document.getElementById('btn-clear-count').addEventListener('click', () => {
      resetCurrentCounters();
      document.getElementById('feedback-box').className = 'hidden';
    });

    // 即時更新算式預覽
    function updateFormulaPreview() {
      const a = document.getElementById('input-full').value;
      const b = document.getElementById('input-partial').value;
      const preview = document.getElementById('preview-calc');

      if (a !== '' && b !== '') {
        const valA = parseFloat(a) || 0;
        const valB = parseFloat(b) || 0;
        const result = valA + (valB / 2);
        preview.textContent = `${valA} + (${valB} ÷ 2) = ${result} cm²`;
      } else {
        preview.textContent = `${a || '_'} + (${b || '_'} ÷ 2) = _ cm²`;
      }
    }

    document.getElementById('input-full').addEventListener('input', updateFormulaPreview);
    document.getElementById('input-partial').addEventListener('input', updateFormulaPreview);

    // 核對答案
    document.getElementById('btn-check-ans').addEventListener('click', () => {
      const inputA = document.getElementById('input-full').value.trim();
      const inputB = document.getElementById('input-partial').value.trim();
      const fb = document.getElementById('feedback-box');

      if (inputA === '' || inputB === '') {
        fb.className = "text-center text-xs font-bold py-2 px-3 rounded-xl mb-2 bg-amber-500/20 text-amber-300 border border-amber-400/40 block";
        fb.textContent = "請先在上方輸入完整方格與不完整方格的數量喔！";
        return;
      }

      const userA = parseInt(inputA, 10);
      const userB = parseInt(inputB, 10);
      const { sysFull, sysPartial } = getSystemCounts();

      const userArea = userA + (userB / 2);
      const correctArea = sysFull + (sysPartial / 2);

      if (userA === sysFull && userB === sysPartial) {
        fb.className = "text-center text-xs font-bold py-2.5 px-3 rounded-xl mb-2 bg-emerald-500/30 text-emerald-200 border border-emerald-400/50 block";
        fb.innerHTML = `🎉 太棒了！完全正確！<br>完整方格 ${userA} 格，不完整 ${userB} 格，估算面積為 <strong>${userArea} cm²</strong>！`;
      } else {
        fb.className = "text-center text-xs font-bold py-2.5 px-3 rounded-xl mb-2 bg-rose-500/25 text-rose-200 border border-rose-400/50 block";
        let hints = [];
        if (userA !== sysFull) hints.push(`完整方格數應為 ${sysFull} 格`);
        if (userB !== sysPartial) hints.push(`不完整方格數應為 ${sysPartial} 格`);
        fb.innerHTML = `再數數看喔！加油！<br><span class="text-[11px] opacity-90">（提示：${hints.join('，')}）</span>`;
      }
    });

    // 初始繪製
    draw();
  </script>
</body>
</html>
