<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>扇形面積探索 - 柚子老師數學教室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1a2a47;
    }

    #app-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1180px;
      height: 720px;
      transform-origin: center center;
      box-sizing: border-box;
      will-change: transform;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }
  </style>
</head>
<body class="flex items-center justify-center">

  <div id="app-wrapper" class="flex flex-col justify-between p-4">

    <!-- 頂部導覽列 -->
    <header class="flex items-center justify-start glass-panel px-4 py-2 rounded-2xl mb-2 flex-shrink-0">
      <a href="index.html" class="flex items-center gap-1.5 text-sky-200 hover:text-white font-bold text-sm bg-white/10 px-4 py-2 rounded-xl border border-white/20 active:scale-95 transition-all">
        <span>⌂ 回首頁</span>
      </a>
    </header>

    <!-- 主操作面板 -->
    <div id="panel-composite" class="flex-1 w-full grid grid-cols-12 gap-4 items-stretch overflow-hidden">
      
      <!-- 左側：幾何操作畫布 -->
      <div class="col-span-6 h-full glass-panel rounded-3xl p-3.5 flex flex-col justify-between items-center relative">
        <div class="w-full flex items-center justify-between gap-2 px-1">
          <div class="flex items-center gap-2 flex-1">
            <span class="text-sm font-bold text-amber-300 whitespace-nowrap">選擇題型：</span>
            <select id="m3-shape-select" class="bg-black/60 border border-sky-400/60 rounded-xl px-3 py-1.5 text-sm font-bold text-sky-200 focus:outline-none focus:border-sky-300 flex-1 cursor-pointer">
              <option value="taiji" selected>1.太極圖形</option>
              <option value="cross">2.準星環狀</option>
              <option value="diag">3.扇形拼湊</option>
              <option value="sub_sq">4.扇形(複合型一)</option>
              <option value="bow">5.扇形(複合型二)</option>
              <option value="leaf">6.扇形(複合型三)</option>
            </select>
          </div>

          <button id="m3-btn-random-dim" class="bg-indigo-500 hover:bg-indigo-400 text-white font-black px-4 py-1.5 rounded-xl text-xs shadow border border-indigo-400/40 active:scale-95 transition-all flex items-center gap-1 flex-shrink-0">
            <span>🎲</span> 換長度
          </button>
        </div>

        <div class="w-full flex justify-between items-center text-xs text-sky-200 px-1 mt-1">
          <span id="m3-canvas-title" class="font-bold text-amber-300 text-sm">1.太極圖形</span>
          <span id="m3-canvas-badge" class="bg-amber-400/20 text-amber-300 border border-amber-400/40 px-2.5 py-1 rounded-full font-mono text-xs font-bold">
            直徑 20 cm
          </span>
        </div>

        <!-- 保持等比例幾何畫布 -->
        <div class="relative flex items-center justify-center flex-1 my-1 w-full overflow-hidden">
          <canvas id="m3GeoCanvas" width="520" height="390" class="rounded-2xl shadow-lg bg-slate-900/60 border border-white/10 max-w-full max-h-full aspect-[4/3] cursor-grab active:cursor-grabbing" style="touch-action: none;"></canvas>
        </div>

        <!-- 底部提示欄 -->
        <div class="w-full bg-black/30 p-2 rounded-2xl border border-white/10 flex items-center justify-center px-3">
          <button id="m3-btn-reset-pos" class="bg-slate-700 hover:bg-slate-600 text-slate-200 font-bold px-5 py-1.5 rounded-xl text-xs border border-white/10 active:scale-95 transition-all flex-shrink-0">
            清空重設 ↺
          </button>
        </div>
      </div>

      <!-- 右側面板：手寫計算空間 -->
      <div class="col-span-6 h-full flex flex-col justify-between space-y-2.5 overflow-hidden">
        
        <!-- 觀察策略卡片 -->
        <div class="glass-panel px-4 py-3 rounded-2xl border border-white/15 flex-shrink-0">
          <div class="text-xs font-black text-amber-300 flex items-center gap-1.5 mb-1">
            <span>💡</span> 觀察策略
          </div>
          <div id="m3-strategy-desc" class="text-base font-bold text-slate-100 leading-snug tracking-wide">
            想想看，如何透過旋轉、移動，拼出另一個圖形
          </div>
        </div>

        <!-- 手寫計算工作面板 -->
        <div id="right-draw-panel" class="glass-panel rounded-3xl p-3.5 flex-1 flex flex-col justify-between items-center relative overflow-hidden">
          <div class="w-full flex items-center justify-between px-1 mb-1.5 flex-shrink-0">
            <div class="flex items-center gap-2">
              <button id="draw-tool-pen" class="bg-sky-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs border border-sky-300 shadow flex items-center gap-1 active:scale-95 transition-all">
                <span>✏️</span> 畫筆
              </button>
              <button id="draw-tool-eraser" class="bg-slate-700/80 hover:bg-slate-600 text-slate-200 font-bold px-3.5 py-1.5 rounded-xl text-xs border border-white/10 flex items-center gap-1 active:scale-95 transition-all">
                <span>🧹</span> 橡皮擦
              </button>
              <button id="draw-tool-clear" class="bg-rose-500/25 hover:bg-rose-500 text-rose-200 hover:text-white font-bold px-3 py-1.5 rounded-xl text-xs border border-rose-400/30 active:scale-95 transition-all">
                清除筆跡 ↺
              </button>
            </div>
            <span class="text-xs text-sky-200/70 font-mono">π ≈ 3.14</span>
          </div>

          <!-- 獨立嵌入的手寫畫布容器 -->
          <div id="calc-container" class="relative flex-1 w-full bg-slate-900/60 rounded-2xl border border-white/10 overflow-hidden my-1 flex items-center justify-center">
            <canvas id="m3CalcCanvas" width="520" height="340" class="max-w-full max-h-full aspect-[520/340] cursor-crosshair block" style="touch-action: none;"></canvas>
            <div id="calc-placeholder" class="pointer-events-none absolute inset-0 flex items-center justify-center text-white/20 text-sm font-bold tracking-widest select-none">
              在此處書寫計算過程
            </div>
          </div>

          <div class="w-full flex flex-col gap-1.5 flex-shrink-0">
            <div class="w-full bg-black/30 px-3.5 py-2 rounded-2xl border border-white/10 flex items-center justify-between gap-2">
              <span class="text-amber-300 font-bold text-xs whitespace-nowrap">計算面積：</span>
              <div class="flex items-center gap-1">
                <input type="number" step="any" id="m3-input-ans-area" placeholder="填寫答案" class="w-32 bg-white/20 border-2 border-emerald-400 rounded-lg px-2 py-0.5 text-center font-black text-emerald-300 text-sm focus:outline-none">
                <span class="text-xs text-white">cm²</span>
              </div>
              <button id="m3-btn-check-ans" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black px-4 py-1.5 rounded-xl text-xs tracking-wider shadow active:scale-95 transition-all">
                核對答案 ➜
              </button>
            </div>
            <div id="m3-msg-feedback" class="hidden text-center text-xs font-bold py-1 px-3 rounded-xl"></div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script>
    window.addEventListener('load', () => {

      function autoScale() {
        const wrapper = document.getElementById('app-wrapper');
        const availWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
        const availHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;
        const scale = Math.min(availWidth / 1180, availHeight / 720) * 0.97;
        wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
      }

      window.addEventListener('resize', autoScale);
      window.addEventListener('orientationchange', () => setTimeout(autoScale, 150));
      if (window.visualViewport) window.visualViewport.addEventListener('resize', autoScale);

      let lastTouchEnd = 0;
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - lastTouchEnd <= 300) e.preventDefault();
        lastTouchEnd = now;
      }, { passive: false });

      const PI = 3.14;

      const M3_CONFIGS = {
        taiji: {
          title: "1.太極圖形",
          dims: [20, 40, 10],
          dimIdx: 0,
          desc: "想想看，如何透過旋轉、移動，拼出另一個圖形",
          calc(d) {
            const r = d / 2;
            const ans = +(r * r * PI / 2).toFixed(2);
            return { badge: `直徑 ${d} cm`, ans };
          }
        },
        cross: {
          title: "2.準星環狀",
          dims: [20, 40, 10],
          dimIdx: 0,
          desc: "想想看，如何透過旋轉、移動，拼出另一個圖形",
          calc(d) {
            const r = d / 2;
            const w = r / 2;
            const ans = +(r * r * PI / 2).toFixed(2);
            return { badge: `大圓直徑 ${d} cm / 環寬 ${w} cm`, ans };
          }
        },
        diag: {
          title: "3.扇形拼湊",
          dims: [40, 20, 10],
          dimIdx: 0,
          desc: "想想看，如何透過旋轉、移動，拼出另一個圖形",
          calc(a) {
            const ans = +(a * a * PI / 4).toFixed(2);
            return { badge: `正方形邊長 ${a} cm`, ans };
          }
        },
        sub_sq: {
          title: "4.扇形(複合型一)",
          dims: [20, 10, 40],
          dimIdx: 0,
          desc: "透過移動，先想解題策略，再計算面積！",
          calc(a) {
            const sq = a * a;
            const sec = +(a * a * PI / 4).toFixed(2);
            const ans = +(sq - sec).toFixed(2);
            return { badge: `邊長 ${a} cm`, ans };
          }
        },
        bow: {
          title: "5.扇形(複合型二)",
          dims: [10, 20, 4],
          dimIdx: 0,
          desc: "透過移動，先想解題策略，再計算面積！",
          calc(r) {
            const sec = +(r * r * PI / 4).toFixed(2);
            const tri = +(r * r / 2).toFixed(2);
            const ans = +(sec - tri).toFixed(2);
            return { badge: `半徑 ${r} cm`, ans };
          }
        },
        leaf: {
          title: "6.扇形(複合型三)",
          dims: [10, 20, 40],
          dimIdx: 0,
          desc: "透過移動，先想解題策略，再計算面積！<br><span class='text-amber-300 text-sm font-bold'>(記得！計算常常不只有一種策略哦！)</span>",
          calc(a) {
            const sec = +(a * a * PI / 4).toFixed(2);
            const tri = +(a * a / 2).toFixed(2);
            const bow = +(sec - tri).toFixed(2);
            const ans = +(bow * 2).toFixed(2);
            return { badge: `邊長 ${a} cm`, ans };
          }
        }
      };

      let m3CurrentType = "taiji";
      let m3Pos = { x: 0, y: 0 };
      let m3AngleDeg = 0;
      let isSnapped = false;

      const OP_LIST = ['＋', '－', '×', '÷'];
      let selectedOp = null;
      let compositeSlots = [null, null, null];

      const LEAF_SHAPE_PALETTE = ['sec', 'tri', 'bow', 'leaf', 'sq', 'corner'];
      const LEAF_OP_PALETTE = ['＋', '－', '×', '÷', '＝', '2'];
      let leafBox1 = [];
      let leafBox2 = [];

      let draggingItem = null;
      let activeDragMode = 'none';
      let pointerStart = { x: 0, y: 0 };
      let initPos = { x: 0, y: 0 };
      let initAngle = 0;
      let rotHandleScreenPos = { x: 0, y: 0 };

      const m3Canvas = document.getElementById('m3GeoCanvas');
      const m3Ctx = m3Canvas.getContext('2d');

      function drawBrightCurvedBracket(ctx, x1, y1, x2, y2, bendOffset, labelText, textSide = 'left') {
        ctx.save();
        ctx.strokeStyle = '#facc15';
        ctx.lineWidth = 2.2;
        ctx.beginPath();
        ctx.moveTo(x1, y1);

        const mx = (x1 + x2) / 2 + (textSide === 'top' || textSide === 'bottom' ? 0 : bendOffset);
        const my = (y1 + y2) / 2 + (textSide === 'top' || textSide === 'bottom' ? bendOffset : 0);
        ctx.quadraticCurveTo(mx, my, x2, y2);
        ctx.stroke();

        ctx.font = 'bold 15px monospace, sans-serif';
        ctx.fillStyle = '#fef08a';
        ctx.textBaseline = 'middle';
        if (textSide === 'left') {
          ctx.textAlign = 'right';
          ctx.fillText(labelText, mx - 8, my);
        } else if (textSide === 'right') {
          ctx.textAlign = 'left';
          ctx.fillText(labelText, mx + 8, my);
        } else if (textSide === 'top') {
          ctx.textAlign = 'center';
          ctx.fillText(labelText, mx, my - 12);
        } else {
          ctx.textAlign = 'center';
          ctx.fillText(labelText, mx, my + 14);
        }
        ctx.restore();
      }

      function renderShapePiece(ctx, type, x, y, size) {
        ctx.save();
        if (type === 'sq') {
          ctx.fillStyle = 'rgba(249, 115, 22, 0.85)';
          ctx.fillRect(x, y, size, size);
          ctx.strokeStyle = '#f97316';
          ctx.lineWidth = 2;
          ctx.strokeRect(x, y, size, size);

          ctx.beginPath();
          ctx.arc(x, y + size, size, -Math.PI / 2, 0, false);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          ctx.setLineDash([3, 3]);
          ctx.stroke();
        } else if (type === 'sec') {
          ctx.beginPath();
          ctx.moveTo(x, y + size);
          ctx.lineTo(x, y);
          ctx.arc(x, y + size, size, -Math.PI / 2, 0, false);
          ctx.closePath();
          ctx.fillStyle = 'rgba(234, 88, 12, 0.85)';
          ctx.fill();
          ctx.strokeStyle = '#ea580c';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + size, y + size);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)';
          ctx.setLineDash([3, 3]);
          ctx.stroke();
        } else if (type === 'corner') {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + size, y);
          ctx.lineTo(x + size, y + size);
          ctx.arc(x, y + size, size, 0, -Math.PI / 2, true);
          ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
          ctx.fill();

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + size, y);
          ctx.lineTo(x + size, y + size);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.arc(x, y + size, size, -Math.PI / 2, 0, false);
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (type === 'tri') {
          ctx.beginPath();
          ctx.moveTo(x, y + size);
          ctx.lineTo(x, y);
          ctx.lineTo(x + size, y + size);
          ctx.closePath();
          ctx.fillStyle = 'rgba(249, 115, 22, 0.85)';
          ctx.fill();
          ctx.strokeStyle = '#f97316';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (type === 'bow') {
          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.arc(x, y + size, size, -Math.PI / 2, 0, false);
          ctx.lineTo(x, y);
          ctx.closePath();
          ctx.fillStyle = 'rgba(56, 189, 248, 0.85)';
          ctx.fill();
          ctx.strokeStyle = '#38bdf8';
          ctx.lineWidth = 2;
          ctx.stroke();
        } else if (type === 'leaf') {
          ctx.beginPath();
          ctx.arc(x, y + size, size, -Math.PI / 2, 0, false);
          ctx.arc(x + size, y, size, Math.PI / 2, Math.PI, false);
          ctx.closePath();
          ctx.fillStyle = 'rgba(34, 197, 94, 0.85)';
          ctx.fill();
          ctx.strokeStyle = '#22c55e';
          ctx.lineWidth = 2;
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(x, y);
          ctx.lineTo(x + size, y + size);
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          ctx.setLineDash([3, 3]);
          ctx.stroke();
        }
        ctx.restore();
      }

      function m3Draw() {
        m3Ctx.clearRect(0, 0, m3Canvas.width, m3Canvas.height);
        const cx = m3Canvas.width / 2;
        const cy = m3Canvas.height / 2;
        const conf = M3_CONFIGS[m3CurrentType];
        const curDim = conf.dims[conf.dimIdx];

        m3Ctx.save();

        if (m3CurrentType === "taiji") {
          const R = 140, r = R / 2;

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, R, Math.PI / 2, -Math.PI / 2, false);
          m3Ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
          m3Ctx.lineWidth = 2;
          m3Ctx.setLineDash([5, 5]);
          m3Ctx.stroke();
          m3Ctx.setLineDash([]);

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false);
          m3Ctx.arc(cx, cy - r, r, Math.PI / 2, -Math.PI / 2, true);
          m3Ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
          m3Ctx.fill();
          m3Ctx.strokeStyle = '#38bdf8';
          m3Ctx.lineWidth = 3;
          m3Ctx.stroke();

          m3Ctx.beginPath();
          m3Ctx.moveTo(cx, cy - R);
          m3Ctx.lineTo(cx, cy + R);
          m3Ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
          m3Ctx.lineWidth = 2;
          m3Ctx.setLineDash([5, 5]);
          m3Ctx.stroke();
          m3Ctx.setLineDash([]);

          const dotRadius = 5.5;
          [cy - r, cy, cy + r].forEach(dotY => {
            m3Ctx.beginPath();
            m3Ctx.arc(cx, dotY, dotRadius, 0, Math.PI * 2);
            m3Ctx.fillStyle = '#ffffff';
            m3Ctx.fill();
            m3Ctx.strokeStyle = '#0f172a';
            m3Ctx.lineWidth = 1.5;
            m3Ctx.stroke();
          });

          m3Ctx.save();
          m3Ctx.font = 'bold 20px monospace, sans-serif';
          const txt = `${curDim}`;
          const textGap = 18;
          const bendX = cx - 32;

          m3Ctx.beginPath();
          m3Ctx.moveTo(cx, cy - R);
          m3Ctx.quadraticCurveTo(bendX, cy - R * 0.45, bendX, cy - textGap);
          m3Ctx.strokeStyle = '#facc15';
          m3Ctx.lineWidth = 2;
          m3Ctx.stroke();

          m3Ctx.beginPath();
          m3Ctx.moveTo(bendX, cy + textGap);
          m3Ctx.quadraticCurveTo(bendX, cy + R * 0.45, cx, cy + R);
          m3Ctx.strokeStyle = '#facc15';
          m3Ctx.lineWidth = 2;
          m3Ctx.stroke();

          m3Ctx.fillStyle = '#fde047';
          m3Ctx.textAlign = 'center';
          m3Ctx.textBaseline = 'middle';
          m3Ctx.fillText(txt, bendX, cy);
          m3Ctx.restore();

          const targetX = isSnapped ? cx : (cx + m3Pos.x);
          const targetY = isSnapped ? (cy - r) : (cy + r + m3Pos.y);
          const rad = (m3AngleDeg * Math.PI) / 180;

          m3Ctx.save();
          m3Ctx.translate(targetX, targetY);
          m3Ctx.rotate(rad);
          m3Ctx.beginPath();
          m3Ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2, false);
          m3Ctx.closePath();
          m3Ctx.fillStyle = isSnapped ? 'rgba(56, 189, 248, 0.6)' : 'rgba(249, 115, 22, 0.85)';
          m3Ctx.fill();
          m3Ctx.strokeStyle = isSnapped ? '#38bdf8' : '#f97316';
          m3Ctx.lineWidth = 2.5;
          m3Ctx.stroke();

          if (!isSnapped) {
            const handleDist = r + 30;
            rotHandleScreenPos.x = targetX + handleDist * Math.sin(rad);
            rotHandleScreenPos.y = targetY - handleDist * Math.cos(rad);

            m3Ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            m3Ctx.lineWidth = 2.2;
            m3Ctx.setLineDash([3, 3]);
            m3Ctx.beginPath();
            m3Ctx.moveTo(0, 0);
            m3Ctx.lineTo(0, -handleDist);
            m3Ctx.stroke();
            m3Ctx.setLineDash([]);

            m3Ctx.beginPath();
            m3Ctx.arc(0, -handleDist, 13, 0, Math.PI * 2);
            m3Ctx.fillStyle = '#ffffff';
            m3Ctx.fill();
            m3Ctx.strokeStyle = '#38bdf8';
            m3Ctx.lineWidth = 3;
            m3Ctx.stroke();

            m3Ctx.fillStyle = '#0284c7';
            m3Ctx.font = 'bold 15px sans-serif';
            m3Ctx.textAlign = 'center';
            m3Ctx.textBaseline = 'middle';
            m3Ctx.fillText('↻', 0, -handleDist);
          }
          m3Ctx.restore();

        } else if (m3CurrentType === "cross") {
          const R = 140;
          const r = R / 2;
          const curR = curDim / 2;
          const curW = curR / 2;

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, R, 0, Math.PI, false);
          m3Ctx.strokeStyle = 'rgba(255, 255, 255, 0.45)';
          m3Ctx.lineWidth = 2;
          m3Ctx.setLineDash([5, 5]);
          m3Ctx.stroke();

          m3Ctx.beginPath();
          m3Ctx.moveTo(cx, cy - R);
          m3Ctx.lineTo(cx, cy + R);
          m3Ctx.stroke();
          m3Ctx.setLineDash([]);

          m3Ctx.beginPath();
          m3Ctx.moveTo(cx - R, cy);
          m3Ctx.lineTo(cx + R, cy);
          m3Ctx.strokeStyle = '#ffffff';
          m3Ctx.lineWidth = 2.2;
          m3Ctx.stroke();

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
          m3Ctx.fillStyle = '#ffffff';
          m3Ctx.fill();

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, R, Math.PI, 0, false);
          m3Ctx.arc(cx, cy, r, 0, Math.PI, true);
          m3Ctx.closePath();
          m3Ctx.fillStyle = 'rgba(56, 189, 248, 0.55)';
          m3Ctx.fill();
          m3Ctx.strokeStyle = '#38bdf8';
          m3Ctx.lineWidth = 3;
          m3Ctx.stroke();

          m3Ctx.beginPath();
          m3Ctx.arc(cx, cy, r, Math.PI, 0, false);
          m3Ctx.strokeStyle = '#ffffff';
          m3Ctx.lineWidth = 2;
          m3Ctx.stroke();

          drawBrightCurvedBracket(m3Ctx, cx, cy - R, cx, cy + R, -32, `${curDim}`, 'left');
          drawBrightCurvedBracket(m3Ctx, cx, cy + r, cx, cy + R, 22, `${curW}`, 'right');

          const curCX = isSnapped ? cx : (cx + m3Pos.x);
          const curCY = isSnapped ? cy : (cy + m3Pos.y);
          const rad = (m3AngleDeg * Math.PI) / 180;

          m3Ctx.save();
          m3Ctx.translate(curCX, curCY);
          m3Ctx.rotate(rad);

          m3Ctx.beginPath();
          m3Ctx.arc(0, 0, r, 0, Math.PI, false);
          m3Ctx.closePath();
          m3Ctx.fillStyle = isSnapped ? 'rgba(56, 189, 248, 0.55)' : 'rgba(249, 115, 22, 0.85)';
          m3Ctx.fill();
          m3Ctx.strokeStyle = isSnapped ? '#38bdf8' : '#f97316';
          m3Ctx.lineWidth = 2.8;
          m3Ctx.stroke();

          if (!isSnapped) {
            const handleDist = r + 30;
            rotHandleScreenPos.x = curCX + handleDist * Math.sin(rad);
            rotHandleScreenPos.y = curCY - handleDist * Math.cos(rad);

            m3Ctx.strokeStyle = 'rgba(255, 255, 255, 0.9)';
            m3Ctx.lineWidth = 2.2;
            m3Ctx.setLineDash([3, 3]);
            m3Ctx.beginPath();
            m3Ctx.moveTo(0, 0);
            m3Ctx.lineTo(0, -handleDist);
            m3Ctx.stroke();
            m3Ctx.setLineDash([]);

            m3Ctx.beginPath();
            m3Ctx.arc(0, -handleDist, 13, 0, Math.PI * 2);
            m3Ctx.fillStyle = '#ffffff';
            m3Ctx.fill();
            m3Ctx.strokeStyle = '#38bdf8';
            m3Ctx.lineWidth = 3;
            m3Ctx.stroke();

            m3Ctx.fillStyle = '#0284c7';

            m3Ctx.textAlign = 'center';
            m3Ctx.textBaseline = 'middle';
            m3Ctx.fillText('↻', 0, -handleDist);

          m3Ctx.restore();

        } else if (m3CurrentType === "diag") {
          const S = 180;
          const sx = cx - S / 2;
          const sy = cy - S / 2;

          m3Ctx.lineWidth = 2;

          m3Ctx.beginPath();
          m3Ctx.strokeRect(sx, sy, S, S);

          m3Ctx.beginPath();
          m3Ctx.moveTo(sx, sy + S);
          m3Ctx.lineTo(sx + S, sy);
          m3Ctx.setLineDash([4, 4]);

            m3Ctx.arc(handleDist * Math.cos(hAngle), handleDist * Math.sin(hAngle), 13, 0, Math.PI * 2);

            m3Ctx.lineWidth = 3;
            m3Ctx.stroke();

            m3Ctx.font = 'bold 15px sans-serif';
            m3Ctx.textAlign = 'center';
            m3Ctx.textBaseline = 'middle';
            m3Ctx.fillText('↻', handleDist * Math.cos(hAngle), handleDist * Math.sin(hAngle));

        } else if (m3CurrentType === "sub_sq" || m3CurrentType === "bow") {

          m3Ctx.fillStyle = '#ffffff';
          m3Ctx.textAlign = 'center';

              m3Ctx.beginPath();
              m3Ctx.arc(draggingItem.x, draggingItem.y, 25, 0, Math.PI * 2);

              m3Ctx.fill();
              m3Ctx.strokeStyle = '#ffffff';
              m3Ctx.lineWidth = 2.5;

              m3Ctx.fillStyle = '#ffffff';

              m3Ctx.textBaseline = 'middle';

          m3Ctx.font = 'bold 14px sans-serif';

            m3Ctx.fillStyle = '#f87171';

          m3Ctx.arc(topX, topY + topSize, topSize, -Math.PI / 2, 0, false);

          m3Ctx.arc(topX + topSize, topY, topSize, Math.PI / 2, Math.PI, false);

            m3Ctx.arc(dot.x, dot.y, 4.5, 0, Math.PI * 2);

          drawBrightCurvedBracket(m3Ctx, topX, topY, topX, topY + topSize, -18, `${curDim}cm`, 'left');
          drawBrightCurvedBracket(m3Ctx, topX, topY + topSize, topX + topSize, topY + topSize, 18, `${curDim}cm`, 'bottom');

          // 零件庫右移並保持距離

          LEAF_SHAPE_PALETTE.forEach((type, i) => {

            m3Ctx.fillStyle = 'rgba(255, 255, 255, 0.25)';
            m3Ctx.textAlign = 'center';
            m3Ctx.textBaseline = 'middle';
            m3Ctx.fillText('【算式二】請由左至右拖入零件排成第二步算式', cx, box2Y + boxH / 2);
          } else {
            const startItemX = boxX + 34;
            const itemSpacing = 58;
            leafBox2.forEach((item, idx) => {
              const ix = startItemX + idx * itemSpacing;
              const iy = box2Y + 31;

              if (LEAF_SHAPE_PALETTE.includes(item)) {
                renderShapePiece(m3Ctx, item, ix - 20, iy - 20, 40);
              } else {
                m3Ctx.beginPath();
                m3Ctx.arc(ix, iy, 19, 0, Math.PI * 2);
                m3Ctx.fillStyle = (item === '2') ? 'rgba(234, 179, 8, 0.4)' : 'rgba(14, 165, 233, 0.4)';
                m3Ctx.fill();
                m3Ctx.strokeStyle = (item === '2') ? '#facc15' : '#38bdf8';
                m3Ctx.lineWidth = 1.8;
                m3Ctx.stroke();

                m3Ctx.font = 'bold 20px monospace, sans-serif';
                m3Ctx.fillStyle = '#ffffff';
                m3Ctx.textAlign = 'center';
                m3Ctx.textBaseline = 'middle';
                m3Ctx.fillText(item, ix, iy);
              }
            });
          }
          m3Ctx.restore();

          if (draggingItem) {
            if (draggingItem.value === '2') {
              m3Ctx.save();
              m3Ctx.beginPath();
              m3Ctx.arc(draggingItem.x, draggingItem.y, 25, 0, Math.PI * 2);
              m3Ctx.fillStyle = 'rgba(234, 179, 8, 0.95)';
              m3Ctx.fill();
              m3Ctx.strokeStyle = '#ffffff';
              m3Ctx.lineWidth = 2.5;
              m3Ctx.stroke();

              m3Ctx.font = 'bold 24px monospace, sans-serif';
              m3Ctx.fillStyle = '#ffffff';
              m3Ctx.textAlign = 'center';
              m3Ctx.textBaseline = 'middle';
              m3Ctx.fillText('2', draggingItem.x, draggingItem.y);
              m3Ctx.restore();
            } else if (draggingItem.kind === 'shape') {
              renderShapePiece(m3Ctx, draggingItem.value, draggingItem.x - 24, draggingItem.y - 24, 48);
            } else if (draggingItem.kind === 'op') {
              m3Ctx.save();
              m3Ctx.beginPath();
              m3Ctx.arc(draggingItem.x, draggingItem.y, 25, 0, Math.PI * 2);
              m3Ctx.fillStyle = 'rgba(14, 165, 233, 0.95)';
              m3Ctx.fill();
              m3Ctx.strokeStyle = '#ffffff';
              m3Ctx.lineWidth = 2.4;
              m3Ctx.stroke();

              m3Ctx.font = 'bold 22px monospace, sans-serif';
              m3Ctx.fillStyle = '#ffffff';
              m3Ctx.textAlign = 'center';
              m3Ctx.textBaseline = 'middle';
              m3Ctx.fillText(draggingItem.value, draggingItem.x, draggingItem.y);
              m3Ctx.restore();
            }
          }

          const str1 = leafBox1.join('');
          const str2 = leafBox2.join('');
          const eqIdx1 = leafBox1.indexOf('＝');
          const eqIdx2 = leafBox2.indexOf('＝');
          const isRow1Complete = eqIdx1 !== -1 && eqIdx1 < leafBox1.length - 1 && leafBox1.length >= 5;
          const isRow2Complete = eqIdx2 !== -1 && eqIdx2 < leafBox2.length - 1 && leafBox2.length >= 5;
          const isBothComplete = isRow1Complete && isRow2Complete;

          const isGirlRow1 = (str1 === 'sec－tri＝bow');
          const isGirlRow2 = ['bow×2＝leaf', '2×bow＝leaf', 'bow＋bow＝leaf'].includes(str2);
          const isGirlMatch = isGirlRow1 && isGirlRow2;

          const isBoyRow1 = (str1 === 'sq－sec＝corner');
          const isBoyRow2 = [
            'sq－corner－corner＝leaf',
            'sq－corner×2＝leaf',
            'sq－2×corner＝leaf',
            'sq－corner＋corner＝leaf'
          ].includes(str2);
          const isBoyMatch = isBoyRow1 && isBoyRow2;

          const isSwapGirlMatch = ['bow×2＝leaf', '2×bow＝leaf', 'bow＋bow＝leaf'].includes(str1) && (str2 === 'sec－tri＝bow');
          const isSwapBoyMatch = [
            'sq－corner－corner＝leaf',
            'sq－corner×2＝leaf',
            'sq－2×corner＝leaf',
            'sq－corner＋corner＝leaf'
          ].includes(str1) && (str2 === 'sq－sec＝corner');

          const isSuccess = isGirlMatch || isBoyMatch || isSwapGirlMatch || isSwapBoyMatch;

          m3Ctx.font = 'bold 15px sans-serif';
          m3Ctx.textAlign = 'center';
          if (isSuccess) {
            m3Ctx.fillStyle = '#4ade80';
            m3Ctx.fillText('🎉 成功列式！', cx, 340);
          } else if (isBothComplete) {
            m3Ctx.fillStyle = '#f87171';
            m3Ctx.fillText('⚠️ 再想想看喔！', cx, 340);
          } else {
            m3Ctx.fillStyle = '#fde047';
            m3Ctx.fillText('💡 分別在上方方框與下方方框排入算式！點擊已放上的零件可收回！', cx, 340);
          }
        }

        m3Ctx.restore();
      }

      function m3UpdateUI() {
        const conf = M3_CONFIGS[m3CurrentType];
        const curDim = conf.dims[conf.dimIdx];
        const calcData = conf.calc(curDim);

        document.getElementById('m3-canvas-title').textContent = conf.title;
        document.getElementById('m3-canvas-badge').textContent = calcData.badge;
        document.getElementById('m3-strategy-desc').innerHTML = conf.desc;

        document.getElementById('m3-input-ans-area').value = '';
        document.getElementById('m3-msg-feedback').className = 'hidden';
        clearCalcCanvas();

        m3Pos = { x: 0, y: 0 };
        m3AngleDeg = 0;
        isSnapped = false;
        compositeSlots = [null, null, null];
        selectedOp = null;
        leafBox1 = [];
        leafBox2 = [];
        draggingItem = null;
        activeDragMode = 'none';
        m3Draw();
      }

      document.getElementById('m3-shape-select').addEventListener('change', (e) => {
        m3CurrentType = e.target.value;
        m3UpdateUI();
      });

      document.getElementById('m3-btn-random-dim').addEventListener('click', () => {
        const conf = M3_CONFIGS[m3CurrentType];
        conf.dimIdx = (conf.dimIdx + 1) % conf.dims.length;
        m3UpdateUI();
      });

      document.getElementById('m3-btn-reset-pos').addEventListener('click', () => {
        m3Pos = { x: 0, y: 0 };
        m3AngleDeg = 0;
        isSnapped = false;
        compositeSlots = [null, null, null];
        selectedOp = null;
        leafBox1 = [];
        leafBox2 = [];
        draggingItem = null;
        m3Draw();
      });

      function animateSnap(targetX, targetY, targetAngle) {
        const startX = m3Pos.x;
        const startY = m3Pos.y;
        const startAngle = m3AngleDeg;
        const startTime = performance.now();
        const duration = 240;

        function step(now) {
          const elapsed = now - startTime;
          const t = Math.min(1, elapsed / duration);
          const ease = t * (2 - t);

          m3Pos.x = startX + (targetX - startX) * ease;
          m3Pos.y = startY + (targetY - startY) * ease;
          m3AngleDeg = startAngle + (targetAngle - startAngle) * ease;
          m3Draw();

          if (t < 1) {
            requestAnimationFrame(step);
          } else {
            isSnapped = true;
            m3Pos.x = targetX;
            m3Pos.y = targetY;
            m3AngleDeg = targetAngle;
            m3Draw();
          }
        }
        requestAnimationFrame(step);
      }

      function checkSnap() {
        if (m3CurrentType === "leaf") {
          if (!draggingItem) return;
          const boxX = 25;
          const boxW = m3Canvas.width - 50;
          const boxH = 62;
          const box1Y = 172;
          const box2Y = 248;

          if (draggingItem.x >= boxX - 16 && draggingItem.x <= boxX + boxW + 16 &&
              draggingItem.y >= box1Y - 16 && draggingItem.y <= box1Y + boxH + 16) {
            if (leafBox1.length < 7) {
              leafBox1.push(draggingItem.value);
            }
          }
          else if (draggingItem.x >= boxX - 16 && draggingItem.x <= boxX + boxW + 16 &&
                   draggingItem.y >= box2Y - 16 && draggingItem.y <= box2Y + boxH + 16) {
            if (leafBox2.length < 7) {
              leafBox2.push(draggingItem.value);
            }
          }

          draggingItem = null;
          return;
        }

        if (m3CurrentType === "sub_sq" || m3CurrentType === "bow") {
          if (!draggingItem) return;
          const cx = m3Canvas.width / 2;
          const slotSize = 88;
          const slotY = 235;
          const slotGap = 60;
          const totalSlotW = slotSize * 3 + slotGap * 2;
          const startSlotX = cx - totalSlotW / 2;

          const slotsPos = [
            { x: startSlotX, y: slotY },
            { x: startSlotX + slotSize + slotGap, y: slotY },
            { x: startSlotX + (slotSize + slotGap) * 2, y: slotY }
          ];

          if (draggingItem.kind === 'shape') {
            slotsPos.forEach((slot, idx) => {
              const centerX = slot.x + slotSize / 2;
              const centerY = slot.y + slotSize / 2;
              if (Math.hypot(draggingItem.x - centerX, draggingItem.y - centerY) < 70) {
                compositeSlots[idx] = draggingItem.value;
              }
            });
          }

          if (draggingItem.kind === 'op') {
            const slotOpX = slotsPos[0].x + slotSize + slotGap / 2;
            const slotOpY = slotY + slotSize / 2;
            if (Math.hypot(draggingItem.x - slotOpX, draggingItem.y - slotOpY) < 55) {
              selectedOp = draggingItem.value;
            }
          }

          draggingItem = null;
          return;
        }

        if (isSnapped) return;

        if (m3CurrentType === "cross") {
          const dist = Math.hypot(m3Pos.x, m3Pos.y);
          const normAngle = ((m3AngleDeg % 360) + 360) % 360;
          const angleDiff = Math.min(Math.abs(normAngle - 180), Math.abs(normAngle - 180 + 360));

          if (dist < 75 && angleDiff < 55) {
            animateSnap(0, 0, 180);
          }
        } else if (m3CurrentType === "diag") {
          const S = 180;
          const dist = Math.hypot(m3Pos.x - (-S), m3Pos.y - S);
          const normAngle = ((m3AngleDeg % 360) + 360) % 360;
          const angleDiff = Math.min(Math.abs(normAngle - 225), Math.abs(normAngle - 225 + 360));

          if (dist < 80 && angleDiff < 60) {
            animateSnap(-S, S, 225);
          }
        } else if (m3CurrentType === "taiji") {
          const r = 70;
          const dist = Math.hypot(m3Pos.x, m3Pos.y - (-r * 2));
          const normAngle = ((m3AngleDeg % 360) + 360) % 360;
          const angleDiff = Math.min(Math.abs(normAngle - 180), Math.abs(normAngle - 180 + 360));

          if (dist < 65 && angleDiff < 50) {
            animateSnap(0, -r * 2, 180);
          }
        }
      }

      function getCanvasCoords(canvas, e) {
        const rect = canvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (canvas.width / rect.width),
          y: (e.clientY - rect.top) * (canvas.height / rect.height)
        };
      }

      m3Canvas.addEventListener('pointerdown', (e) => {
        const pt = getCanvasCoords(m3Canvas, e);
        const cx = m3Canvas.width / 2;

        if (m3CurrentType === "leaf") {
          const libX = 185;
          const libY = 14;
          const pSize = 42;

          for (let i = 0; i < LEAF_SHAPE_PALETTE.length; i++) {
            const bx = libX + 10 + i * 51 + pSize / 2;
            const by = libY + 12 + pSize / 2;
            if (Math.hypot(pt.x - bx, pt.y - by) <= 32) {
              draggingItem = { kind: 'shape', value: LEAF_SHAPE_PALETTE[i], x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          for (let i = 0; i < LEAF_OP_PALETTE.length; i++) {
            const bx = libX + 31 + i * 51;
            const by = libY + 88;
            if (Math.hypot(pt.x - bx, pt.y - by) <= 30) {
              const val = LEAF_OP_PALETTE[i];
              draggingItem = { kind: (val === '2' ? 'shape' : 'op'), value: val, x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          const boxX = 25;
          const box1Y = 172;
          const box2Y = 248;
          const startItemX = boxX + 34;
          const itemSpacing = 58;

          for (let i = 0; i < leafBox1.length; i++) {
            const ix = startItemX + i * itemSpacing;
            const iy = box1Y + 31;
            if (Math.hypot(pt.x - ix, pt.y - iy) <= 30) {
              const removed = leafBox1.splice(i, 1)[0];
              const isShape = LEAF_SHAPE_PALETTE.includes(removed);
              draggingItem = { kind: isShape ? 'shape' : 'op', value: removed, x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          for (let i = 0; i < leafBox2.length; i++) {
            const ix = startItemX + i * itemSpacing;
            const iy = box2Y + 31;
            if (Math.hypot(pt.x - ix, pt.y - iy) <= 30) {
              const removed = leafBox2.splice(i, 1)[0];
              const isShape = LEAF_SHAPE_PALETTE.includes(removed);
              draggingItem = { kind: isShape ? 'shape' : 'op', value: removed, x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          return;
        }

        if (m3CurrentType === "sub_sq" || m3CurrentType === "bow") {
          const topSize = 135;
          const topX = cx - 130;
          const topY = 25;

          const opBoxX = cx + 80;
          const opBoxY = topY + 6;
          for (let i = 0; i < OP_LIST.length; i++) {
            const row = Math.floor(i / 2);
            const col = i % 2;
            const btnX = opBoxX + 22 + col * 64;
            const btnY = opBoxY + 44 + row * 48;
            if (Math.hypot(pt.x - btnX, pt.y - btnY) <= 30) {
              draggingItem = { kind: 'op', value: OP_LIST[i], x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          const slotSize = 88;
          const slotY = 235;
          const slotGap = 60;
          const totalSlotW = slotSize * 3 + slotGap * 2;
          const startSlotX = cx - totalSlotW / 2;

          const slotsPos = [
            { x: startSlotX, y: slotY },
            { x: startSlotX + slotSize + slotGap, y: slotY },
            { x: startSlotX + (slotSize + slotGap) * 2, y: slotY }
          ];

          for (let i = 0; i < 3; i++) {
            const s = slotsPos[i];
            if (compositeSlots[i] && pt.x >= s.x && pt.x <= s.x + slotSize && pt.y >= s.y && pt.y <= s.y + slotSize) {
              draggingItem = { kind: 'shape', value: compositeSlots[i], x: pt.x, y: pt.y };
              compositeSlots[i] = null;
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          const slotOpX = slotsPos[0].x + slotSize + slotGap / 2;
          const slotOpY = slotY + slotSize / 2;
          if (selectedOp && Math.hypot(pt.x - slotOpX, pt.y - slotOpY) <= 34) {
            draggingItem = { kind: 'op', value: selectedOp, x: pt.x, y: pt.y };
            selectedOp = null;
            activeDragMode = 'move';
            m3Canvas.setPointerCapture(e.pointerId);
            m3Draw();
            return;
          }

          if (m3CurrentType === "sub_sq") {
            const leftHotbox = (pt.x >= topX - 45 && pt.x <= topX + 18 && pt.y >= topY - 15 && pt.y <= topY + topSize + 15);
            if (leftHotbox) {
              draggingItem = { kind: 'shape', value: 'sq', x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }

            if (pt.x >= topX && pt.x <= topX + topSize && pt.y >= topY && pt.y <= topY + topSize) {
              const distToCenter = Math.hypot(pt.x - topX, pt.y - (topY + topSize));
              if (distToCenter > topSize) {
                draggingItem = { kind: 'shape', value: 'corner', x: pt.x, y: pt.y };
              } else {
                draggingItem = { kind: 'shape', value: 'sec', x: pt.x, y: pt.y };
              }
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }

          } else if (m3CurrentType === "bow") {
            const edgeLeftHotbox = (pt.x >= topX - 45 && pt.x <= topX + 10 && pt.y >= topY - 15 && pt.y <= topY + topSize + 15);
            if (edgeLeftHotbox) {
              draggingItem = { kind: 'shape', value: 'sec', x: pt.x, y: pt.y };
              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }

            const circleOriginX = topX;
            const circleOriginY = topY + topSize;
            const distToCenter = Math.hypot(pt.x - circleOriginX, pt.y - circleOriginY);

            if (distToCenter <= topSize + 15 && pt.x >= topX && pt.y <= circleOriginY) {
              const relX = pt.x - topX;
              const relY = circleOriginY - pt.y;
              const isBowSide = (relX + relY) > (topSize + 2);

              if (isBowSide) {
                draggingItem = { kind: 'shape', value: 'bow', x: pt.x, y: pt.y };
              } else {
                draggingItem = { kind: 'shape', value: 'tri', x: pt.x, y: pt.y };
              }

              activeDragMode = 'move';
              m3Canvas.setPointerCapture(e.pointerId);
              m3Draw();
              return;
            }
          }

          return;
        }

        if (isSnapped) return;

        const distToHandle = Math.hypot(pt.x - rotHandleScreenPos.x, pt.y - rotHandleScreenPos.y);
        if (distToHandle <= 32) {
          activeDragMode = 'rotate';
          pointerStart = pt;
          initAngle = m3AngleDeg;
          m3Canvas.setPointerCapture(e.pointerId);
          return;
        }

        activeDragMode = 'move';
        pointerStart = pt;
        initPos = { x: m3Pos.x, y: m3Pos.y };
        m3Canvas.setPointerCapture(e.pointerId);
      });

      m3Canvas.addEventListener('pointermove', (e) => {
        if (activeDragMode === 'none') return;
        const pt = getCanvasCoords(m3Canvas, e);

        if (m3CurrentType === "leaf" || m3CurrentType === "sub_sq" || m3CurrentType === "bow") {
          if (draggingItem) {
            draggingItem.x = pt.x;
            draggingItem.y = pt.y;
            m3Draw();
          }
          return;
        }

        if (isSnapped) return;

        if (activeDragMode === 'move') {
          m3Pos.x = initPos.x + (pt.x - pointerStart.x);
          m3Pos.y = initPos.y + (pt.y - pointerStart.y);
        } else if (activeDragMode === 'rotate') {
          const cx = m3Canvas.width / 2;
          const cy = m3Canvas.height / 2;
          let centerPt = { x: cx + m3Pos.x, y: cy + 70 + m3Pos.y };

          if (m3CurrentType === "diag") {
            centerPt = { x: cx + 90 + m3Pos.x, y: cy - 90 + m3Pos.y };
          }

          const angleCurrent = Math.atan2(pt.y - centerPt.y, pt.x - centerPt.x);
          const angleInit = Math.atan2(pointerStart.y - centerPt.y, pointerStart.x - centerPt.x);
          const deltaDeg = (angleCurrent - angleInit) * (180 / Math.PI);

          m3AngleDeg = (initAngle + deltaDeg + 360) % 360;
        }

        m3Draw();
      });

      function onPointerEnd(e) {
        if (activeDragMode === 'none') return;
        activeDragMode = 'none';
        try { m3Canvas.releasePointerCapture(e.pointerId); } catch(err) {}
        checkSnap();
        m3Draw();
      }

      m3Canvas.addEventListener('pointerup', onPointerEnd);
      m3Canvas.addEventListener('pointercancel', onPointerEnd);

      // ==================== 純粹高靈敏原生手寫板引擎（零延遲連續筆劃） ====================
      const calcCanvas = document.getElementById('m3CalcCanvas');
      const calcCtx = calcCanvas.getContext('2d', { desynchronized: true });
      const placeholder = document.getElementById('calc-placeholder');

      let currentTool = 'pen';
      let isDrawing = false;
      let lastPoint = { x: 0, y: 0 };

      function clearCalcCanvas() {
        calcCtx.clearRect(0, 0, calcCanvas.width, calcCanvas.height);
        placeholder.style.display = 'flex';
      }

      document.getElementById('draw-tool-pen').addEventListener('click', () => {
        currentTool = 'pen';
        document.getElementById('draw-tool-pen').className = "bg-sky-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs border border-sky-300 shadow flex items-center gap-1 active:scale-95 transition-all";
        document.getElementById('draw-tool-eraser').className = "bg-slate-700/80 hover:bg-slate-600 text-slate-200 font-bold px-3.5 py-1.5 rounded-xl text-xs border border-white/10 flex items-center gap-1 active:scale-95 transition-all";
      });

      document.getElementById('draw-tool-eraser').addEventListener('click', () => {
        currentTool = 'eraser';
        document.getElementById('draw-tool-eraser').className = "bg-sky-500 text-white font-bold px-3.5 py-1.5 rounded-xl text-xs border border-sky-300 shadow flex items-center gap-1 active:scale-95 transition-all";
        document.getElementById('draw-tool-pen').className = "bg-slate-700/80 hover:bg-slate-600 text-slate-200 font-bold px-3.5 py-1.5 rounded-xl text-xs border border-white/10 flex items-center gap-1 active:scale-95 transition-all";
      });

      document.getElementById('draw-tool-clear').addEventListener('click', clearCalcCanvas);

      function getDirectCoords(e) {
        const rect = calcCanvas.getBoundingClientRect();
        return {
          x: (e.clientX - rect.left) * (calcCanvas.width / rect.width),
          y: (e.clientY - rect.top) * (calcCanvas.height / rect.height)
        };
      }

      function drawLine(p1, p2) {
        calcCtx.beginPath();
        calcCtx.moveTo(p1.x, p1.y);
        calcCtx.lineTo(p2.x, p2.y);
        calcCtx.lineCap = 'round';
        calcCtx.lineJoin = 'round';

        if (currentTool === 'pen') {
          calcCtx.strokeStyle = '#fef08a';
          calcCtx.lineWidth = 3.5;
          calcCtx.stroke();
        } else {
          calcCtx.save();
          calcCtx.globalCompositeOperation = 'destination-out';
          calcCtx.lineWidth = 26;
          calcCtx.strokeStyle = 'rgba(0,0,0,1)';
          calcCtx.stroke();
          calcCtx.restore();
        }
      }

      // 下筆立即觸發，不再排隊等待
      calcCanvas.addEventListener('pointerdown', (e) => {
        isDrawing = true;
        placeholder.style.display = 'none';
        lastPoint = getDirectCoords(e);

        calcCtx.beginPath();
        calcCtx.arc(lastPoint.x, lastPoint.y, currentTool === 'pen' ? 1.75 : 13, 0, Math.PI * 2);
        if (currentTool === 'pen') {
          calcCtx.fillStyle = '#fef08a';
          calcCtx.fill();
        } else {
          calcCtx.save();
          calcCtx.globalCompositeOperation = 'destination-out';
          calcCtx.fillStyle = 'rgba(0,0,0,1)';
          calcCtx.fill();
          calcCtx.restore();
        }
      });

      calcCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;

        // 捕捉 Apple Pencil 所有高速採樣點
        const events = (typeof e.getCoalescedEvents === 'function') ? e.getCoalescedEvents() : [e];
        for (const ev of events) {
          const pt = getDirectCoords(ev);
          drawLine(lastPoint, pt);
          lastPoint = pt;
        }
      });

      const stopDrawing = () => {
        isDrawing = false;
      };

      calcCanvas.addEventListener('pointerup', stopDrawing);
      calcCanvas.addEventListener('pointercancel', stopDrawing);
      calcCanvas.addEventListener('pointerleave', stopDrawing);

      // ==================== 答案核對 ====================
      document.getElementById('m3-btn-check-ans').addEventListener('click', () => {
        const userVal = parseFloat(document.getElementById('m3-input-ans-area').value.trim());
        const msg = document.getElementById('m3-msg-feedback');
        const conf = M3_CONFIGS[m3CurrentType];
        const curDim = conf.dims[conf.dimIdx];
        const calcData = conf.calc(curDim);

        if (isNaN(userVal)) {
          msg.className = "text-center text-xs font-bold py-1 px-3 rounded-xl bg-amber-500/20 text-amber-300 block";
          msg.textContent = "請輸入計算出的面積數值喔！";
          return;
        }

        if (Math.abs(userVal - calcData.ans) < 0.15) {
          msg.className = "text-center text-xs font-bold py-1 px-3 rounded-xl bg-emerald-500/30 text-emerald-200 block";
          msg.innerHTML = `🎉 太優秀了！完全正確！面積為 <strong>${calcData.ans} cm²</strong>！`;
        } else {
          msg.className = "text-center text-xs font-bold py-1 px-3 rounded-xl bg-rose-500/25 text-rose-200 block";
          msg.innerHTML = `⚠️ 檢查看看算式：答案應該是 <strong>${calcData.ans} cm²</strong>！`;
        }
      });

      // 初始化：進入第 1 題「1.太極圖形」
      autoScale();
      m3CurrentType = "taiji";
      document.getElementById('m3-shape-select').value = "taiji";
      m3UpdateUI();
    });
  </script>
</body>
</html>
