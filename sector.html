<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>扇形與複合面積探索 - 柚子老師數學教室</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      touch-action: pan-x pan-y pinch-zoom;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #1a2a47;
    }

    #app-wrapper {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 1024px;
      height: 660px;
      transform-origin: center center;
      box-sizing: border-box;
      will-change: transform;
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.18);
      backdrop-filter: blur(8px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
    }

    input[type=number]::-webkit-inner-spin-button, 
    input[type=number]::-webkit-outer-spin-button { 
      -webkit-appearance: none; 
      margin: 0; 
    }

    input[type=range] {
      -webkit-appearance: none;
      background: rgba(255, 255, 255, 0.2);
      border-radius: 9999px;
      height: 6px;
    }
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      cursor: pointer;
      border: 2px solid #ffffff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.4);
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 9999px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 9999px;
    }
  </style>
</head>
<body class="flex items-center justify-center">

  <div id="app-wrapper" class="flex flex-col justify-between p-4">

    <!-- 頂部題型導覽列（6 大題型快速切換） -->
    <header class="flex items-center justify-between glass-panel px-4 py-2 rounded-2xl mb-2 flex-shrink-0">
      <a href="index.html" class="flex items-center gap-1.5 text-sky-200 hover:text-white font-bold text-xs bg-white/10 px-3 py-1.5 rounded-xl border border-white/20 active:scale-95 transition-all">
        <span>⌂ 回首頁</span>
      </a>

      <!-- 6 大題型頁籤按鈕 -->
      <div class="flex items-center gap-1 bg-black/30 p-1 rounded-xl border border-white/15" id="tab-container">
        <button data-type="taiji" class="q-tab px-2.5 py-1 rounded-lg font-black text-xs bg-amber-500 text-slate-950 shadow">1. 太極圖形</button>
        <button data-type="cross" class="q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white">2. 準星環狀</button>
        <button data-type="diag" class="q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white">3. 扇形拼湊</button>
        <button data-type="sub_sq" class="q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white">4. 方扣扇形</button>
        <button data-type="bow" class="q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white">5. 弓形面積</button>
        <button data-type="leaf" class="q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white">6. 葉片幾何</button>
      </div>

      <button id="btn-random-dim" class="bg-indigo-500 hover:bg-indigo-400 text-white font-black py-1 px-2.5 rounded-xl text-xs shadow border border-indigo-400/40 active:scale-95 transition-all flex items-center gap-1">
        <span>🎲</span> 隨機變更長度
      </button>
    </header>

    <!-- 主工作區：左側幾何操作 ＋ 右側策略算式 -->
    <main class="grid grid-cols-12 gap-4 flex-1 w-full items-stretch overflow-hidden">
      
      <!-- 左側互動幾何工作台 -->
      <div class="col-span-6 h-full glass-panel rounded-3xl p-3 flex flex-col justify-between items-center relative">
        <div class="w-full flex justify-between items-center text-xs text-sky-200 px-1">
          <span id="canvas-q-title" class="font-bold text-amber-300">題型 1：太極圖形（割補移位）</span>
          <span id="canvas-dim-badge" class="bg-amber-400/20 text-amber-300 border border-amber-400/40 px-2 py-0.5 rounded-full font-mono text-[11px] font-bold">
            直徑 20 cm
          </span>
        </div>

        <!-- 畫布 Canvas -->
        <div class="relative flex items-center justify-center flex-1 my-1 w-full overflow-hidden">
          <canvas id="geoCanvas" width="460" height="380" class="rounded-2xl shadow-lg bg-slate-900/60 border border-white/10 w-full h-full object-contain"></canvas>
        </div>

        <!-- 底部動手移動／拼湊控制條 -->
        <div class="w-full bg-black/30 p-2 rounded-2xl border border-white/10 flex items-center justify-between gap-2 px-3">
          <span class="text-xs text-sky-200 font-bold flex-shrink-0" id="ctrl-label">拖曳拼湊進度：</span>
          <input type="range" id="animSlider" min="0" max="100" value="0" class="flex-1 cursor-pointer">
          <button id="btn-auto-toggle" class="bg-sky-500 hover:bg-sky-400 text-slate-950 font-black px-3 py-1 rounded-xl text-xs shadow active:scale-95 transition-all flex-shrink-0">
            自動拼合 ➔
          </button>
        </div>
      </div>

      <!-- 右側解題策略與即時填算 -->
      <div class="col-span-6 h-full flex flex-col text-white overflow-y-auto pr-1 space-y-2.5 custom-scroll">
        
        <!-- 步驟 1：幾何策略觀察卡 -->
        <div class="glass-panel p-3.5 rounded-2xl border border-white/15 space-y-2">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-amber-300 flex items-center gap-1">
              <span>💡</span> 觀察與解題策略
            </span>
            <span id="strategy-badge" class="text-[11px] font-bold text-emerald-400 bg-emerald-500/20 px-2 py-0.5 rounded border border-emerald-400/30">
              割補拼合
            </span>
          </div>
          <p id="strategy-desc" class="text-xs text-slate-200 leading-relaxed">
            把左下方凸出來的小半圓，平移並翻轉補到右上方凹進去的地方，剛好可以拼成一個完整的<strong>「大半圓」</strong>！
          </p>
        </div>

        <!-- 步驟 2：學生動手填算與核對卡 -->
        <div class="glass-panel p-3.5 rounded-2xl border border-white/15 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-black text-sky-300 flex items-center gap-1">
              <span>✏️</span> 計算與核對
            </span>
            <span class="text-[11px] text-sky-200/80 font-mono">π ≈ 3.14</span>
          </div>

          <!-- 動態算式引導提示 -->
          <div class="bg-black/30 p-2.5 rounded-xl border border-white/10 text-xs font-mono space-y-1.5">
            <div id="formula-guide-text" class="text-slate-300">
              算式：大半圓半徑 ＝ 10 cm<br>
              面積 ＝ 10 × 10 × 3.14 ÷ 2 ＝
            </div>
            <div class="flex items-center gap-2 pt-1">
              <span class="text-amber-300 font-bold">填入最終面積：</span>
              <input type="number" step="any" id="input-ans-area" placeholder="請計算" class="w-28 bg-white/20 border-2 border-emerald-400 rounded-lg px-2 py-0.5 text-center font-black text-emerald-300 text-sm focus:outline-none">
              <span class="text-xs">cm²</span>
            </div>
          </div>

          <button id="btn-check-ans" class="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-black py-2 rounded-xl text-xs tracking-wider shadow-lg active:scale-95 transition-all">
            送出核對答案 ➜
          </button>
          <div id="msg-feedback" class="hidden text-center text-xs font-bold py-1.5 px-3 rounded-xl"></div>
        </div>

        <!-- 步驟 3：規律小結語 -->
        <div class="glass-panel p-3 rounded-2xl border border-white/10 bg-black/25 text-xs text-amber-200 leading-relaxed">
          <strong>老師的話：</strong><span id="teacher-tip">複雜的幾何圖形不要急著硬算，先看看能不能「移位拼湊」或「大圖形減小圖形」，計算會簡單很多！</span>
        </div>

      </div>

    </main>

  </div>

  <script>
    // ==================== 1. 平板自適應縮放 ====================
    function autoScale() {
      const wrapper = document.getElementById('app-wrapper');
      const baseWidth = 1024;
      const baseHeight = 660;

      const availWidth = window.visualViewport ? window.visualViewport.width : window.innerWidth;
      const availHeight = window.visualViewport ? window.visualViewport.height : window.innerHeight;

      const scale = Math.min(availWidth / baseWidth, availHeight / baseHeight) * 0.91;
      wrapper.style.transform = `translate(-50%, -50%) scale(${scale})`;
    }

    window.addEventListener('resize', autoScale);
    window.addEventListener('orientationchange', () => { setTimeout(autoScale, 150); });
    window.addEventListener('DOMContentLoaded', autoScale);
    if (window.visualViewport) {
      window.visualViewport.addEventListener('resize', autoScale);
    }

    let lastTouchEnd = 0;
    document.addEventListener('touchend', (e) => {
      const now = Date.now();
      if (now - lastTouchEnd <= 300) e.preventDefault();
      lastTouchEnd = now;
    }, { passive: false });

    const PI = 3.14;

    // ==================== 2. 六大題型配置資料庫 ====================
    const SHAPE_CONFIGS = {
      taiji: {
        title: "題型 1：太極圖形（半圓等量移位）",
        dimOptions: [20, 40, 10], // 直徑 cm
        dimIdx: 0,
        strategyBadge: "等量割補",
        strategy: "把左下方凸出來的小半圓，向上平移補到右上方凹陷處，剛好拼成一個完整的「大半圓」！",
        teacherTip: "一進一出，原本凹進去的被凸出來的填滿，只算大半圓面積即可！",
        sliderLabel: "拖曳拼補進度：",
        getFormula(d) {
          const r = d / 2;
          const ans = +(r * r * PI / 2).toFixed(2);
          return {
            badge: `直徑 ${d} cm`,
            guide: `大半圓半徑 ＝ ${r} cm<br>面積 ＝ ${r} × ${r} × 3.14 ÷ 2 ＝`,
            ans: ans
          };
        }
      },
      cross: {
        title: "題型 2：準星環狀（同心圓環切片移位）",
        dimOptions: [20, 40, 30], // 外直徑 cm
        dimIdx: 0,
        strategyBadge: "同心圓移位",
        strategy: "下方突出的半圓內環，剛好可以向上推進上方空心的內圓洞中，完整拼成「大半圓」！",
        teacherTip: "看清楚內外層！把下面補到上面，就完全不需要大圓減小圓再除以二了！",
        sliderLabel: "向上推進進度：",
        getFormula(d) {
          const r = d / 2;
          const ans = +(r * r * PI / 2).toFixed(2);
          return {
            badge: `外直徑 ${d} cm`,
            guide: `大半圓半徑 ＝ ${r} cm<br>拼合後面積 ＝ ${r} × ${r} × 3.14 ÷ 2 ＝`,
            ans: ans
          };
        }
      },
      diag: {
        title: "題型 3：扇形拼湊（對角線對稱翻轉）",
        dimOptions: [40, 20, 10], // 邊長 cm
        dimIdx: 0,
        strategyBadge: "對稱旋轉拼合",
        strategy: "右上方的一片扇形，沿對角線翻轉移動補到左邊，剛好拼成「等腰直角三角形」（半個正方形）！",
        teacherTip: "這題完全不用算圓周率 3.14！拼成三角形後，直接底乘高除以 2 即可！",
        sliderLabel: "對角翻轉拼合：",
        getFormula(a) {
          const ans = +(a * a / 2).toFixed(2);
          return {
            badge: `邊長 ${a} cm`,
            guide: `拼成直角三角形 (半個正方形)<br>面積 ＝ ${a} × ${a} ÷ 2 ＝`,
            ans: ans
          };
        }
      },
      sub_sq: {
        title: "題型 4：正方形扣掉扇形（角隅面積）",
        dimOptions: [20, 10, 40], // 邊長 cm
        dimIdx: 0,
        strategyBadge: "大圖形扣小圖形",
        strategy: "由完整的正方形，扣掉內部的 1/4 圓扇形，剩下的就是藍色角隅區域。",
        teacherTip: "大圖形（正方形）扣掉空白圖形（扇形），是幾何求面積最經典的基本功！",
        sliderLabel: "扇形分離演示：",
        getFormula(a) {
          const sq = a * a;
          const sec = +(a * a * PI / 4).toFixed(2);
          const ans = +(sq - sec).toFixed(2);
          return {
            badge: `邊長 ${a} cm`,
            guide: `正方形面積 ＝ ${a} × ${a} ＝ ${sq}<br>1/4圓扇形 ＝ ${a} × ${a} × 3.14 ÷ 4 ＝ ${sec}<br>角隅面積 ＝ ${sq} － ${sec} ＝`,
            ans: ans
          };
        }
      },
      bow: {
        title: "題型 5：弓形面積（扇形扣三角形）",
        dimOptions: [10, 20, 4], // 半徑 cm
        dimIdx: 0,
        strategyBadge: "扇形扣三角形",
        strategy: "半徑 1/4 圓扇形，沿著弦用剪刀切開，扣掉下方的直角三角形，留下弓形。",
        teacherTip: "弓形面積 ＝ 扇形面積 － 等腰直角三角形面積！",
        sliderLabel: "剪開脫離演示：",
        getFormula(r) {
          const sec = +(r * r * PI / 4).toFixed(2);
          const tri = +(r * r / 2).toFixed(2);
          const ans = +(sec - tri).toFixed(2);
          return {
            badge: `半徑 ${r} cm`,
            guide: `1/4圓扇形 ＝ ${r} × ${r} × 3.14 ÷ 4 ＝ ${sec}<br>直角三角形 ＝ ${r} × ${r} ÷ 2 ＝ ${tri}<br>弓形面積 ＝ ${sec} － ${tri} ＝`,
            ans: ans
          };
        }
      },
      leaf: {
        title: "題型 6：葉片幾何（雙弧交疊面積）",
        dimOptions: [10, 20, 40], // 邊長 cm
        dimIdx: 0,
        strategyBadge: "對角分割(弓形×2)",
        strategy: "沿正方形對角線切開，剛好分成兩個一樣大的「弓形」！算出一片弓形再乘以 2。",
        teacherTip: "葉片面積 ＝ (1/4圓 － 直角三角形) × 2，也可以用兩個扇形相加減正方形！",
        sliderLabel: "切半拆解演示：",
        getFormula(a) {
          const sec = +(a * a * PI / 4).toFixed(2);
          const tri = +(a * a / 2).toFixed(2);
          const bow = +(sec - tri).toFixed(2);
          const ans = +(bow * 2).toFixed(2);
          return {
            badge: `邊長 ${a} cm`,
            guide: `單片弓形 ＝ (${a}×${a}×3.14÷4) － (${a}×${a}÷2) ＝ ${bow}<br>完整葉片面積 ＝ ${bow} × 2 ＝`,
            ans: ans
          };
        }
      }
    };

    let currentType = "taiji";
    let animProgress = 0.0; // 0.0 ~ 1.0 (拖曳拼合進度)
    let autoAnimId = null;

    // ==================== 3. Canvas 繪圖渲染 ====================
    const canvas = document.getElementById('geoCanvas');
    const ctx = canvas.getContext('2d');

    function drawCurrentShape() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const p = animProgress; // 0 ~ 1

      const conf = SHAPE_CONFIGS[currentType];
      const curDim = conf.dimOptions[conf.dimIdx];

      ctx.save();

      if (currentType === "taiji") {
        // ========== 1. 太極圖形 ==========
        const R = 120;
        const r = R / 2;

        // 底層虛線大圓
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 直徑虛線
        ctx.beginPath();
        ctx.moveTo(cx, cy - R);
        ctx.lineTo(cx, cy + R);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
        ctx.setLineDash([4, 4]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 固定右半部分（包含大右半圓扣去右上小半圓）
        ctx.beginPath();
        ctx.arc(cx, cy, R, -Math.PI / 2, Math.PI / 2, false); // 右大半圓弧
        ctx.arc(cx, cy - r, r, Math.PI / 2, -Math.PI / 2, true); // 挖去右上小半圓
        ctx.fillStyle = 'rgba(56, 189, 248, 0.6)'; // 亮藍
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 可移動的左下小半圓 (從下半部平移旋轉到右上補洞)
        // 起點位置: (cx, cy + r), 終點位置: (cx, cy - r)
        const curY = (cy + r) + ((cy - r) - (cy + r)) * p;
        const curRot = p * Math.PI; // 旋轉 180 度

        ctx.save();
        ctx.translate(cx, curY);
        ctx.rotate(curRot);
        ctx.beginPath();
        ctx.arc(0, 0, r, Math.PI / 2, -Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = (p > 0.95) ? 'rgba(56, 189, 248, 0.6)' : 'rgba(249, 115, 22, 0.75)'; // 拼合時變藍色
        ctx.fill();
        ctx.strokeStyle = (p > 0.95) ? '#38bdf8' : '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 標註直徑長度
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'right';
        ctx.fillText(`直徑 ${curDim} cm`, cx - 12, cy);

      } else if (currentType === "cross") {
        // ========== 2. 準星環狀 ==========
        const R = 125;
        const r = 62.5;

        // 底層虛線大圓
        ctx.beginPath();
        ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 水平直徑線
        ctx.beginPath();
        ctx.moveTo(cx - R, cy);
        ctx.lineTo(cx + R, cy);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 上半部外環（固定）
        ctx.beginPath();
        ctx.arc(cx, cy, R, Math.PI, 0, false);
        ctx.arc(cx, cy, r, 0, Math.PI, true);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 可移動的下半小半圓（向上推進補洞）
        const moveY = -r * p;
        ctx.save();
        ctx.translate(0, moveY);
        ctx.beginPath();
        ctx.arc(cx, cy, r, 0, Math.PI, false);
        ctx.closePath();
        ctx.fillStyle = (p > 0.95) ? 'rgba(56, 189, 248, 0.6)' : 'rgba(249, 115, 22, 0.75)';
        ctx.fill();
        ctx.strokeStyle = (p > 0.95) ? '#38bdf8' : '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 標註外直徑
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText(`直徑 ${curDim} cm`, cx, cy + R + 18);

      } else if (currentType === "diag") {
        // ========== 3. 扇形拼湊 ==========
        const S = 180; // 正方形寬度
        const sx = cx - S / 2;
        const sy = cy - S / 2;

        // 正方形虛線外框
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
        ctx.lineWidth = 1.5;
        ctx.setLineDash([5, 5]);
        ctx.strokeRect(sx, sy, S, S);
        ctx.setLineDash([]);

        // 對角線
        ctx.beginPath();
        ctx.moveTo(sx, sy + S);
        ctx.lineTo(sx + S, sy);
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 左半邊固定扇形區域
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx, sy + S);
        ctx.lineTo(sx + S / 2, sy + S / 2);
        ctx.arc(sx, sy, S, Math.PI / 4, 0, true);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 右上角可翻轉移動的扇形區域（翻轉補齊成三角形）
        // 隨 p 漸變位置與角度
        ctx.save();
        ctx.translate(sx + S * (1 - p * 0.5), sy + S * (p * 0.5));
        ctx.rotate(p * Math.PI / 2);
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(0, S);
        ctx.arc(0, 0, S, Math.PI / 2, Math.PI / 4, true);
        ctx.closePath();
        ctx.fillStyle = (p > 0.95) ? 'rgba(56, 189, 248, 0.6)' : 'rgba(249, 115, 22, 0.75)';
        ctx.fill();
        ctx.strokeStyle = (p > 0.95) ? '#38bdf8' : '#f97316';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 標註正方形邊長
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText(`邊長 ${curDim} cm`, cx, sy - 8);

      } else if (currentType === "sub_sq") {
        // ========== 4. 正方形扣掉扇形 ==========
        const S = 170;
        const sx = cx - S / 2;
        const sy = cy - S / 2;

        // 完整正方形外框
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.strokeRect(sx, sy, S, S);

        // 塗色角隅區域（正方形扣去 1/4 圓）
        ctx.beginPath();
        ctx.moveTo(sx + S, sy);
        ctx.lineTo(sx + S, sy + S);
        ctx.arc(sx, sy, S, Math.PI / 2, 0, true);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 演示白色扇形向左下抽離 (分離距離 offset)
        const off = p * 45;
        ctx.save();
        ctx.translate(-off, off);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.arc(sx, sy, S, 0, Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = (p > 0.05) ? 'rgba(255, 255, 255, 0.4)' : 'rgba(255, 255, 255, 0.1)';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 標註邊長
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText(`${curDim} cm`, cx, sy + S + 18);

      } else if (currentType === "bow") {
        // ========== 5. 弓形面積 ==========
        const R = 170;
        const sx = cx - R / 2;
        const sy = cy - R / 2;

        // 塗色弓形
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.arc(sx, sy, R, 0, Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = 'rgba(56, 189, 248, 0.65)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2.5;
        ctx.stroke();

        // 可剪開脫離的直角三角形
        const dropY = p * 45;
        ctx.save();
        ctx.translate(-dropY * 0.5, dropY);
        ctx.beginPath();
        ctx.moveTo(sx, sy);
        ctx.lineTo(sx + R, sy);
        ctx.lineTo(sx, sy + R);
        ctx.closePath();
        ctx.fillStyle = (p > 0.05) ? 'rgba(249, 115, 22, 0.5)' : 'rgba(255, 255, 255, 0.2)';
        ctx.fill();
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 2;
        ctx.stroke();

        // 剪刀剪開線
        if (p > 0.05) {
          ctx.font = '16px sans-serif';
          ctx.fillText('✂️', sx + R * 0.5, sy + R * 0.5 - 10);
        }
        ctx.restore();

        // 標註半徑
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText(`半徑 ${curDim} cm`, sx + R / 2, sy - 8);

      } else if (currentType === "leaf") {
        // ========== 6. 葉片幾何 ==========
        const S = 170;
        const sx = cx - S / 2;
        const sy = cy - S / 2;

        // 正方形外框
        ctx.strokeStyle = '#ffffff';
        ctx.lineWidth = 1.5;
        ctx.strokeRect(sx, sy, S, S);

        // 葉片（雙弧相交）
        // 沿對角線分兩半，隨 p 分離
        const sep = p * 30;

        // 下半弓形
        ctx.save();
        ctx.translate(-sep * 0.7, sep * 0.7);
        ctx.beginPath();
        ctx.moveTo(sx, sy + S);
        ctx.lineTo(sx + S, sy);
        ctx.arc(sx, sy, S, Math.PI / 4, Math.PI / 2, false);
        ctx.closePath();
        ctx.fillStyle = 'rgba(16, 185, 129, 0.7)';
        ctx.fill();
        ctx.strokeStyle = '#10b981';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 上半弓形
        ctx.save();
        ctx.translate(sep * 0.7, -sep * 0.7);
        ctx.beginPath();
        ctx.moveTo(sx, sy + S);
        ctx.lineTo(sx + S, sy);
        ctx.arc(sx + S, sy + S, S, -Math.PI / 2, -3 * Math.PI / 4, true);
        ctx.closePath();
        ctx.fillStyle = (p > 0.05) ? 'rgba(56, 189, 248, 0.7)' : 'rgba(16, 185, 129, 0.7)';
        ctx.fill();
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.stroke();
        ctx.restore();

        // 標註邊長
        ctx.font = 'bold 13px monospace';
        ctx.fillStyle = '#facc15';
        ctx.textAlign = 'center';
        ctx.fillText(`邊長 ${curDim} cm`, cx, sy - 8);
      }

      ctx.restore();
    }

    // ==================== 4. 題型切換與更新邏輯 ====================
    function updateUIForCurrentShape() {
      const conf = SHAPE_CONFIGS[currentType];
      const curDim = conf.dimOptions[conf.dimIdx];
      const formInfo = conf.getFormula(curDim);

      document.getElementById('canvas-q-title').textContent = conf.title;
      document.getElementById('canvas-dim-badge').textContent = formInfo.badge;
      document.getElementById('strategy-badge').textContent = conf.strategyBadge;
      document.getElementById('strategy-desc').textContent = conf.strategy;
      document.getElementById('teacher-tip').textContent = conf.teacherTip;
      document.getElementById('ctrl-label').textContent = conf.sliderLabel;

      document.getElementById('formula-guide-text').innerHTML = `算式導引：<br>${formInfo.guide}`;
      document.getElementById('input-ans-area').value = '';
      document.getElementById('msg-feedback').className = 'hidden';

      animProgress = 0.0;
      document.getElementById('animSlider').value = 0;
      drawCurrentShape();
    }

    // 頁籤點擊切換
    document.querySelectorAll('.q-tab').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.q-tab').forEach(b => {
          b.className = "q-tab px-2.5 py-1 rounded-lg font-bold text-xs text-sky-200 hover:text-white";
        });
        e.target.className = "q-tab px-2.5 py-1 rounded-lg font-black text-xs bg-amber-500 text-slate-950 shadow";
        currentType = e.target.getAttribute('data-type');
        updateUIForCurrentShape();
      });
    });

    // 隨機變更長度按鈕
    document.getElementById('btn-random-dim').addEventListener('click', () => {
      const conf = SHAPE_CONFIGS[currentType];
      conf.dimIdx = (conf.dimIdx + 1) % conf.dimOptions.length;
      updateUIForCurrentShape();
    });

    // 拖曳進度滑桿
    document.getElementById('animSlider').addEventListener('input', (e) => {
      animProgress = parseInt(e.target.value, 10) / 100;
      drawCurrentShape();
    });

    // 自動拼合 / 還原切換按鈕
    document.getElementById('btn-auto-toggle').addEventListener('click', () => {
      if (autoAnimId) cancelAnimationFrame(autoAnimId);
      const target = (animProgress < 0.5) ? 1.0 : 0.0;
      const startP = animProgress;
      const startTime = performance.now();
      const duration = 600;

      function step(now) {
        const elapsed = now - startTime;
        const t = Math.min(1, elapsed / duration);
        animProgress = startP + (target - startP) * (t * (2 - t));
        document.getElementById('animSlider').value = Math.round(animProgress * 100);
        drawCurrentShape();

        if (t < 1) {
          autoAnimId = requestAnimationFrame(step);
        } else {
          document.getElementById('btn-auto-toggle').textContent = (target === 1.0) ? "還原分開 ↺" : "自動拼合 ➔";
        }
      }
      autoAnimId = requestAnimationFrame(step);
    });

    // 核對答案
    document.getElementById('btn-check-ans').addEventListener('click', () => {
      const userVal = parseFloat(document.getElementById('input-ans-area').value.trim());
      const msg = document.getElementById('msg-feedback');
      const conf = SHAPE_CONFIGS[currentType];
      const curDim = conf.dimOptions[conf.dimIdx];
      const formInfo = conf.getFormula(curDim);

      if (isNaN(userVal)) {
        msg.className = "text-center text-xs font-bold py-1.5 px-3 rounded-xl bg-amber-500/20 text-amber-300 block";
        msg.textContent = "請輸入計算出的面積數值喔！";
        return;
      }

      if (Math.abs(userVal - formInfo.ans) < 0.15) {
        msg.className = "text-center text-xs font-bold py-2 px-3 rounded-xl bg-emerald-500/30 text-emerald-200 block";
        msg.innerHTML = `🎉 太厲害了！完全正確！<br>面積為 <strong>${formInfo.ans} cm²</strong>！`;
      } else {
        msg.className = "text-center text-xs font-bold py-2 px-3 rounded-xl bg-rose-500/25 text-rose-200 block";
        msg.innerHTML = `⚠️ 檢查看看算式：答案應該是 <strong>${formInfo.ans} cm²</strong>！`;
      }
    });

    // 初始載入題型 1
    updateUIForCurrentShape();
  </script>
</body>
</html>
